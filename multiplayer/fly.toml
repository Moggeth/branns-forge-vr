# Template only: replace the app name and exact HTTPS origin before deployment.
app = "replace-with-approved-branns-proof-app"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8090"
  SIMULATION_PORT = "8081"
  WORLD_DATA_DIR = "/data/worlds"
  ALLOWED_ORIGINS = "https://replace-with-approved-branns-proof-app.fly.dev"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "world_data"
  destination = "/data"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

<!doctype html><meta charset="utf-8"><title>Ore vein review</title><style>body{margin:0;background:#9aafb5}canvas{display:block}</style>
<script type="module">
// Review page for the mountain-foot vein deposits, their new ore/metal pickups and the distance glint.
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createResourceArt} from '../client/forest-resource-art.js';
import {createOreGlint} from '../client/ore-glint.js';
const W=1280,H=800,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.55;room.dispose();pmrem.dispose();scene.background=new T.Color(0xa9bfcb);
scene.add(new T.HemisphereLight(0xf0f4ff,0x756a3a,1.6));const sun=new T.DirectionalLight(0xfff0d8,2.6);sun.position.set(-8,12,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(200,200).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x6f7a4a,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const camera=new T.PerspectiveCamera(48,W/H,.1,300),art=createResourceArt(),glint=createOreGlint({scene,renderer});
const kinds=['copper','iron','gold','mithril','star'],deposits=[];
kinds.forEach((kind,i)=>{for(let v=0;v<2;v++){const root=art.deposit(kind,{variant:v});const x=(i-2)*3.2,z=v*-3.4;root.position.set(x,0,z);root.rotation.y=v*1.7+i;scene.add(root);deposits.push({id:`vein${i}t${v}`,kind,x,z,hits:0,maxHits:4,depleted:false,vein:i*2+v});}});
for(const [n,kind]of ['copperOre','goldOre','copper','gold'].entries()){const p=art.pickup(kind);p.position.set((n-1.5)*1.6,0,3.2);p.scale.setScalar(2.6);scene.add(p);}
glint.sync({deposits,edits:[]});
const view=(pos,look,t)=>{camera.position.set(...pos);camera.lookAt(...look);camera.updateMatrixWorld();art.update(t);glint.update(t,camera);renderer.render(scene,camera);};
window.oreVeinReview={stats:()=>({resources:art.stats(),glint:glint.stats()}),close:()=>view([0,6.5,11],[0,.6,-1],1.15),far:()=>view([0,3.2,62],[0,.8,-2],1.3)};
await renderer.compileAsync(scene,camera);window.oreVeinReview.close();document.title='ready';
</script>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axe cleave in game</title>
<style>body{margin:0;background:#172223;color:#efdfbc;font:13px system-ui;height:100vh;display:flex;flex-direction:column}header{padding:6px 10px}button{padding:8px;margin:2px}canvas{flex:1;min-height:0;width:100%}#error{color:#ff7777}body.clean header{display:none}</style>
<header>Orchard's Edge cleave — actual game renderer, local authority.
<button id="aim">Hold aim</button><button id="cast">Release / cast</button><button id="run">Run 1 s</button><button id="end">Skip to last 3 s</button><button id="god">Orbit view</button><button id="hero">Hero view</button>
<span id="status"></span><div id="error"></div></header><canvas id="world" aria-label="Crystal wall review world"></canvas>
<script type="module">
// Axe cleave review: the real createGame renderer and a local shared simulation (copied from crystal-wall-review). The hero
// stands at ?at=x,z facing ?yaw (radians, 0 faces -Z) with the axe; ?foes=f,r;f,r places skeletons by forward/right
// metres. ?clean hides the toolbar, ?auto runs the authority at 60 Hz. Not shipped.
import {createGame} from '../client/game.js';
import {createSimulation,loadSimulation,terrainHeight} from '../shared/simulation.js';
import {createEnemy} from '../shared/combat.js';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);if(q.has('clean'))document.body.classList.add('clean');
const at=(q.get('at')||'0,3').split(',').map(Number),yaw=Number(q.get('yaw')??Math.PI);
let sim=createSimulation({room:'WALL_REVIEW'}),seq=0,role='hero',auto=q.has('auto');
sim.addPlayer({id:'hero',name:'Reviewer'});sim.addPlayer({id:'god',name:'Camera',role:'god'});
let save=sim.checkpoint();save.players[0].position=[at[0],terrainHeight(save,at[0],at[1]),at[1]];save.players[0].yaw=yaw;save.players[0].tool='axe';
if(q.has('foes')){const f=[-Math.sin(yaw),-Math.cos(yaw)],r=[Math.cos(yaw),-Math.sin(yaw)];
 save.enemies=q.get('foes').split(';').map(v=>v.split(',').map(Number)).map(([a,b],i)=>{const x=at[0]+f[0]*a+r[0]*b,z=at[1]+f[1]*a+r[1]*b;return Object.assign(createEnemy('foe'+i,[x,terrainHeight(save,x,z),z]),{yaw:Math.atan2(Math.sin(yaw+Math.PI),Math.cos(yaw+Math.PI))});});}
sim=loadSimulation(save);
window.addEventListener('error',e=>$('error').textContent=e.message);window.addEventListener('unhandledrejection',e=>$('error').textContent=String(e.reason));
const game=createGame({canvas:$('world'),onStatus:text=>$('status').textContent=text,
 onAction:(action,extra)=>{const r=sim.command('hero',{type:'action',seq:++seq,action,...extra});for(const e of r.events||[])game.handleEvent(e);$('status').textContent=action+': '+(r.ok?'ok':r.code);publish();},
 onInput:input=>sim.command(role==='god'?'god':'hero',{type:'input',seq:++seq,...input,move:{x:0,z:0}})});
function publish(){game.applySnapshot(sim.snapshot(),role);}
function step(n=1){for(let i=0;i<n;i++)for(const e of sim.step())game.handleEvent(e);publish();}
publish();game.setRole('hero');game.setActive(true);
window.review={
 step,run:(seconds=1)=>new Promise(done=>{let left=Math.round(seconds*60);const timer=setInterval(()=>{step(Math.min(4,left));left-=4;if(left<=0){clearInterval(timer);done(sim.snapshot().tick);}},1000/15);}),
 aim:()=>game.specialPress(true),cast:()=>game.specialPress(false),look:(x,y)=>game.lookByPixels(x,y),
 view(next){role=next;publish();game.setRole(next);if(next==='god')game.centerView();},
 skipToWarning(){const s=sim.checkpoint(),start=Math.min(...s.edits.filter(e=>e.wall).map(e=>e.rupture.startTick));s.tick=start+3600-180-2;sim=loadSimulation(s);publish();},
 equip:(tool='pick')=>game.equip(tool),tick:()=>sim.snapshot().tick,stats:()=>game.diagnostics(),snapshot:()=>sim.snapshot(),
};
$('aim').onclick=()=>review.aim();$('cast').onclick=()=>review.cast();$('run').onclick=()=>review.run(1);$('end').onclick=()=>review.skipToWarning();
$('god').onclick=()=>review.view('god');$('hero').onclick=()=>review.view('hero');
if(auto)setInterval(()=>step(1),1000/60);
window.addEventListener('pagehide',()=>game.dispose());
</script></html>

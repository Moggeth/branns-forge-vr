<!doctype html><html lang="en"><meta charset="utf-8"><title>Bone physics lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#a9c0cc;overflow:hidden}canvas{display:block}#cap{position:fixed;left:14px;bottom:12px;font:600 18px system-ui;color:#fff;text-shadow:0 1px 3px #000}</style>
<div id="cap"></div>
<script type="module">
// Skeleton bone physics review on the shipped path: the real shared combat (hitEnemyPart, projectileContact,
// stepCombat and the remains ragdoll) published to the real combat view at 20 Hz like a browser host, so the
// clips show snapshot prediction, hinged elbows/knees/jaws and bone splinters exactly as players see them.
// Deterministic: window.lab.frame(i) renders frame i at 30 fps.
// ?scene=snap      Siegebird bolts snap an arm and then a leg off a skeleton that keeps on coming
// ?scene=crumple   an axe finishes it: the magic lets go and it drops into a heap of bones
// ?scene=shatter   a War Hammer swing bursts it into flying bones and splinters
// ?scene=headshot  a Siegebird bolt to the skull: thunk, the head snaps back and it goes over backwards
// ?scene=all       the four in a row          ?phone  phone quality (fewer splinters)   ?play  run live. Not shipped.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {prepareAsset} from '../client/asset-pose.js';
import {applyEnemyMotion} from '../client/enemy-motion.js';
import {dressSkeleton} from '../client/skeleton-look.js';
import {createCombatView, capturePartPoses} from '../client/combat-view.js';
import {createEnemy, hitEnemyPart, projectileContact, stepCombat, partPosition} from '../shared/combat.js';
const q=new URLSearchParams(location.search),phone=q.has('phone'),W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:!phone});r.setPixelRatio(phone?Math.min(2,devicePixelRatio):1);r.setSize(W,H);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=!phone;document.body.append(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xa9c0cc);s.fog=new THREE.Fog(s.background,22,48);
s.add(new THREE.HemisphereLight(0xc6e0ed,0x5e5139,1.25));
const sun=new THREE.DirectionalLight(0xffe3ad,2.2);sun.position.set(6,10,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9});s.add(sun,sun.target);
// A gentle slope so bones roll and settle on real ground, not a flat table.
const height=(x,z)=>Math.sin(x*.35)*.12+Math.cos(z*.3)*.1;
const groundGeo=new THREE.PlaneGeometry(80,80,120,120).rotateX(-Math.PI/2),gp=groundGeo.attributes.position;for(let i=0;i<gp.count;i++)gp.setY(i,height(gp.getX(i),gp.getZ(i)));groundGeo.computeVertexNormals();
const ground=new THREE.Mesh(groundGeo,new THREE.MeshStandardMaterial({color:0x6f7d3d,roughness:1}));ground.receiveShadow=true;s.add(ground);
const cam=new THREE.PerspectiveCamera(phone?55:40,W/H,.05,90),cap=document.getElementById('cap'),DT=1/30;
const templates=new Map(),actors=new Map();
let combat,hammer,axe;const hammerPivot=new THREE.Group();
const order=q.get('scene')==='all'?['snap','crumple','shatter','headshot']:[q.get('scene')||'shatter'];
const log=[];
const SCENES={
 snap:{dur:9.5,cam:[3.4,1.6,4.6,0,.85,0],x:0},
 crumple:{dur:5.5,cam:[2.6,1.5,3.6,0,.6,0],x:0},
 shatter:{dur:6,cam:[-4.4,1.9,4.4,-1.2,.6,-1.3],x:0},
 headshot:{dur:5.5,cam:[3.8,1.5,1.4,0,.9,-.6],x:0},
};
// ---- one shared world, stepped at 60 Hz, published every third tick like a browser host ----
let S,ctx,n=0,pending=[],sceneStart=0,cur=null,curName='',actor=null,lastPublished=-1;
function world(){S={tick:0,players:[{id:'hero',role:'hero',position:[0,0,6],yaw:0,stats:{contribution:0,kills:0},hands:[]}],enemies:[],projectiles:[],embeds:[],detachedParts:[],pickups:[]};
 ctx={nextId:(st,p)=>`${p}${++n}`,terrainHeight:(st,x,z)=>height(x,z),fireContact:()=>[],flareBurst:()=>[],damageHero:()=>{}};}
function spawn(id,x,z,yaw,variant){
 const root=new THREE.Group();root.position.set(x,height(x,z),z);root.rotation.y=yaw;s.add(root);
 const visual=prepareAsset(templates.get('skeleton'),'skeleton',1.7).visual;visual.traverse(o=>{if(o.isMesh)o.castShadow=true;});
 dressSkeleton(visual,id,variant);root.add(visual);
 const data=createEnemy(id,[x,height(x,z),z]);data.yaw=yaw;S.enemies.push(data);
 // Like a remote client, the actor draws from published snapshots; `live` is the simulation's own record.
 const entry={enemy:true,root,visual,data:structuredClone(data),live:data};actors.set(`e:${id}`,entry);return entry;}
function publish(){for(const ev of pending)log.push(`${S.tick} ${ev.kind}${ev.style?':'+ev.style:''}${ev.part?':'+ev.part:''}${ev.damage!==undefined?' dmg '+ev.damage:''}`);const snap=structuredClone({tick:S.tick,enemies:S.enemies,projectiles:S.projectiles,embeds:S.embeds,detachedParts:S.detachedParts});
 combat.prepareActors(snap);combat.sync(snap,{prepared:true});
 for(const [key,e] of actors){const d=snap.enemies.find(d=>d.id===e.live.id);if(d)e.data=d;else{e.root.removeFromParent();actors.delete(key);}}
 for(const ev of pending)combat.handleEvent(ev);pending=[];lastPublished=S.tick;}
function contact(e,part){e.root.updateWorldMatrix(true,true);const poses=capturePartPoses(e.visual);return poses;}
// Melee: the shared hit with the posed part poses the client reports.
function strike(e,part,tool,point,normal,damage){const hit={tool,ownerId:'hero',point,normal,partPoses:contact(e,part)};
 const ev=[];hitEnemyPart(S,e.live,part,damage,hit,ctx,ev);pending.push(...ev);return ev;}
// Siegebird bolt: a real projectile in flight; when it reaches the bone the host reports the contact.
function fireBolt(id,from,to){const d=to.map((v,i)=>v-from[i]),l=Math.hypot(...d),v=d.map(x=>x/l*42);
 S.projectiles.push({id,ownerId:'hero',kind:'bolt',position:[...from],previousPosition:[...from],velocity:v,curve:[0,0,0],bornTick:S.tick,trail:[[...from]]});return {id,to,part:null};}
const shots=[];
function flyBolts(){for(const shot of [...shots]){const p=S.projectiles.find(x=>x.id===shot.id);if(!p){shots.splice(shots.indexOf(shot),1);continue;}
  const before=p.previousPosition,after=p.position,ab=after.map((v,i)=>v-before[i]),t=ab.reduce((a,v,i)=>a+v*(shot.to[i]-before[i]),0)/ab.reduce((a,v)=>a+v*v,0);
  if(t<=1&&t>=0){const e=actor;if(!e||!S.enemies.includes(e.live)){shots.splice(shots.indexOf(shot),1);continue;}
   e.root.updateWorldMatrix(true,true);const k=Math.min(1,Math.max(0,t)),point=before.map((v,i)=>v+ab[i]*k),dir=p.velocity.map(v=>v/Math.hypot(...p.velocity));
   const res=projectileContact(S,{projectileId:p.id,targetId:e.live.id,part:shot.part,point,normal:dir.map(v=>-v),localPoint:[0,0,0],localQuaternion:[0,0,0,1],boneName:'',partPoses:contact(e,shot.part)},ctx);
   if(!res.ok)log.push(`${S.tick} contact refused: ${res.code} point ${point.map(v=>v.toFixed(2))} enemy ${e.live.position.map(v=>v.toFixed(2))} trail ${JSON.stringify(p.trail.slice(-2).map(q=>q.map(v=>+v.toFixed(2))))}`);pending.push(...(res.events||[]));shots.splice(shots.indexOf(shot),1);}}}
// Where a part is on the posed actor right now.
function partAt(e,bone){e.root.updateWorldMatrix(true,true);const b=e.visual.getObjectByName(bone);return b?b.getWorldPosition(new THREE.Vector3()).toArray():partPosition(e.data,'torso');}
// ---- scenes: scripted at fixed times, everything else is the shared simulation ----
const SCRIPT={
 snap(t,tick){const e=actor;
  if(tick===1){e.live.attackTick=-1000;}
  // It keeps marching at the hero and swinging, whatever it has left.
  if(S.enemies.includes(e.live)){const legs=e.live.missingParts.filter(p=>p.endsWith('Leg')).length,sp=.45*(legs===2?.2:legs===1?.55:1);
   e.live.position[2]+=sp/60;e.live.position[1]=height(e.live.position[0],e.live.position[2]);if(tick%95===40)e.live.attackTick=tick;}
  const shoot=(part,bone,at)=>{if(tick!==at)return;const to=partAt(e,bone);to[2]+=.03;const from=[to[0]+2.4,to[1]+.15,to[2]+11];const sh=fireBolt(`b${tick}`,from,to);sh.part=part;shots.push(sh);};
  shoot('rightArm','RightForearm',70);shoot('leftLeg','LeftKnee',260);
  return tick<87?'Siegebird bolt to the arm...':tick<278?'Snap! It keeps coming.':tick<340?'A leg goes too':'Still fighting on one leg';},
 crumple(t,tick){const e=actor;
  if(S.enemies.includes(e.live)&&[60,110,160].includes(tick)){const at=partAt(e,'Torso');at[1]+=.15;at[2]+=.12;axeSwing=tick;strike(e,'torso',tick===160?'axe':'axe',at,[0.35,0,0.94],tick===160?999:20);}
  return tick<160?'An axe wears it down...':'The binding magic lets go: a heap of bones';},
 shatter(t,tick){const e=actor;
  if(tick===62&&S.enemies.includes(e.live)){const at=partAt(e,'Torso');at[1]+=.1;at[2]+=.15;strike(e,'torso','hammer',at,[.55,0,.83],e.live.hp+1);}
  if(tick>=40)hammerSwing=tick-40;else hammerSwing=-1;
  return tick<62?'War Hammer, finishing blow...':'SMASH: bones and splinters everywhere';},
 headshot(t,tick){const e=actor;
  if(tick===50){const to=partAt(e,'Head');to[1]+=.09;to[2]+=.1;const from=[to[0]+.6,to[1]+.1,to[2]+12];const sh=fireBolt('hs',from,to);sh.part='head';shots.push(sh);}
  return tick<62?'Siegebird, aimed at the skull...':'THUNK. Headshot.';},
};
let axeSwing=-999,hammerSwing=-1;
function setup(name){cur=SCENES[name];curName=name;sceneStart=S?S.tick:0;
 for(const [key,e] of actors){e.root.removeFromParent();actors.delete(key);}
 if(combat)combat.dispose();
 combat=createCombatView({scene:s,templates,actors,camera:cam,height,quality:phone?'low':'high'});
 world();n=0;pending=[];shots.length=0;axeSwing=-999;hammerSwing=-1;
 actor=spawn(`lab-${name}`,0,0,0,{snap:1,crumple:3,shatter:0,headshot:4}[name]);
 publish();}
const swingAxe=new THREE.Vector3(1,0,0);
function weapons(tick){
 // A flat sweep from the hero's right: the head arrives at the ribcage on tick 62 moving the way the bones fly.
 if(hammer){hammerPivot.visible=curName==='shatter'&&hammerSwing>=0;if(hammerPivot.visible){const k=hammerSwing,u=Math.min(1,k/22),ease=u*u*(3-2*u),follow=k>22?Math.min(1,(k-22)/20):0;
  hammerPivot.rotation.y=-.45-2.1*ease-.55*(1-(1-follow)**2);}}
 if(axe){const k=tick-axeSwing;axe.visible=curName==='crumple'&&k>=-10&&k<25;if(axe.visible){const u=Math.min(1,Math.max(0,(k+10)/12));axe.position.set(.55,1.2,.95);axe.rotation.set(0,.2,1.6-u*2.4);}}}
function frameAt(i){
 const t=i*DT;let total=0,idx=0;for(;idx<order.length;idx++){if(t<total+SCENES[order[idx]].dur)break;total+=SCENES[order[idx]].dur;}idx=Math.min(idx,order.length-1);
 const local=t-total,target=Math.round(local*60);
 if(curName!==order[idx]||target<S.tick)setup(order[idx]);
 while(S.tick<target){S.tick++;flyBolts();
  const label=SCRIPT[curName](S.tick/60,S.tick);cap.textContent=label;
  const ev=[];stepCombat(S,ctx,ev);pending.push(...ev);
  for(const e of S.enemies){const a=actors.get(`e:${e.id}`);if(a){a.root.position.fromArray(e.position);}}
  if(S.tick%3===0)publish();}
 combat.beginCreatureFrame();
 for(const e of actors.values())applyEnemyMotion(e,{tick:S.tick,dt:DT,height,threats:[[0,height(0,6),6]]});
 combat.tick(DT,false,t,S.tick);weapons(S.tick);
 const c=q.get('cam')?q.get('cam').split(',').map(Number):cur.cam;cam.position.set(c[0],c[1],c[2]);cam.lookAt(c[3],c[4],c[5]);
 if(curName==='snap'&&actor){const z=Math.min(actor.live.position[2],2.2);cam.position.z+=z;cam.lookAt(0,.75,z);}
 r.render(s,cam);return t;}
const loader=new GLTFLoader(),load=u=>new Promise(res=>loader.load(u,res));
Promise.all(['skeleton','crossbow','hammer','axe'].map(k=>load(`/assets/${k}.glb`))).then(([sk,cb,hm,ax])=>{
 templates.set('skeleton',sk);templates.set('crossbow',cb);
 hammer=prepareAsset(hm,'hammer').visual;hammer.scale.multiplyScalar(1.15);hammer.rotation.z=Math.PI/2;hammerPivot.position.set(.8,1.12,-.42);hammerPivot.add(hammer);s.add(hammerPivot);axe=prepareAsset(ax,'axe').visual;s.add(axe);
 const total=order.reduce((a,k)=>a+SCENES[k].dur,0);
 window.lab={log,state:()=>S,frames:Math.round(total*30),frame:frameAt,stats:()=>({shards:combat.boneShardStats(),parts:S.detachedParts.length,hinged:[...combat.detached.values()].filter(n=>n.userData.hinges).length}),ready:true};
 frameAt(0);document.title='ready';
 if(q.has('play')){let i=0;setInterval(()=>{frameAt(i);i=(i+1)%window.lab.frames;},1000/30);}});
</script></html>

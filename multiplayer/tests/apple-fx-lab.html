<!doctype html><html><head><meta charset="utf-8"><title>loading</title><style>html,body{margin:0;background:#9fb3c4}</style></head><body>
<script type="module">
// Close-up review of the Timberline apple effects (Opus 5.5, 2026-10-04): a bolt bursting one apple, the wire cutting
// another into halves that tumble down, land on a face and settle. Real shared physics (stepFruit) and the real
// presentation (createAppleSnack); flat ground at y = 0. lab.frame() advances one 60 Hz frame and renders it.
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createAppleSnack} from '../client/apple-snack.js';
import {stepFruit,createFruit} from '../shared/fruit.js';
const W=960,H=540,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new T.Scene();const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.55;room.dispose();scene.background=new T.Color(0x9fb3c4);
scene.add(new T.HemisphereLight(0xe8f2ff,0x5a4b2a,1.2));const sun=new T.DirectionalLight(0xfff0d8,2.8);sun.position.set(-2,4,3);sun.castShadow=true;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(20,20).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x5f7040,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const cam=new T.PerspectiveCamera(40,W/H,.01,100);cam.position.set(.7,1.05,1.9);cam.lookAt(0,.75,0);scene.add(cam);
const snack=createAppleSnack({scene,camera:cam,templates:new Map(),height:()=>0});
const state={tick:0,players:[],harvestedTrees:[],edits:[],fruit:createFruit()},ctx={nextId:(s,p)=>p+(++s.tick*100),terrainHeight:()=>0};
// the wire's cut: the plane normal n, the halves part along it and carry the blade's travel
const n=[.8,0,.6],travel=[0,-.25,-.97],at=[.25,1.15,0],r=.085;
for(const side of [1,-1]){const out=n.map(k=>k*side);state.fruit.drops.push({id:'half'+(side>0?'a':'b'),stick:'none',apples:1,bites:0,radius:r,position:at.map((k,i)=>k+out[i]*r*.15),velocity:[out[0]*1.3+travel[0]*1.6,1+out[1]*.6,out[2]*1.3+travel[2]*1.6],dir:[0,1,0],mode:'air',bornTick:0,biteTick:-1000,heldBy:null,half:true,cut:out.map(k=>-k)});}
let frame=0;const events=[];
window.lab={frame(){
 if(frame===0){snack.event({kind:'apple_slice',ids:['halfa','halfb'],position:at,normal:n,direction:travel},'me');}
 if(frame===24){snack.event({kind:'apple_burst',position:[-.35,1.0,-.2],radius:r,direction:[.9,.05,.4]},'me');}
 if(frame===48){snack.event({kind:'apple_burst',position:[-.1,1.25,-.5],radius:r,direction:[.6,-.1,.8]},'me');}
 state.tick++;events.length=0;stepFruit(state,ctx,events);for(const e of events)snack.event(e,'me');
 snack.sync(JSON.parse(JSON.stringify({tick:state.tick,fruit:state.fruit})),'me');
 snack.update(1/60,{now:performance.now()/1000,renderTick:state.tick});renderer.render(scene,cam);frame++;return state.fruit.drops.map(d=>[d.id,d.mode,d.cut]);}};
document.title='ready';
</script></body></html>

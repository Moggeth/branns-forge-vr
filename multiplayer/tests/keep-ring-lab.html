<!doctype html><meta charset="utf-8"><title>Keep ring lab</title><style>body{margin:0;background:#20242a}canvas{display:block}</style>
<script type="module">
// Review page for the ring keeps: the real carved terrain (shared/terrain.js baseHeight) around a keep corner, the base
// (client/home-base-view.js), its town (client/home-town-view.js), the back town behind it (client/back-town-view.js) and
// the mountain shell (client/mountain-arena.js) with the Blender kits. ?w=&h= sets the canvas.
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createSimulation} from '../shared/simulation.js';
import {baseHeight} from '../shared/terrain.js';
import {HOME_SITES,homePiece,pieceWorld,TAVERN_SCALE} from '../shared/home-bases.js';
import {createHomeBaseView} from '../client/home-base-view.js';
import {createHomeTownView} from '../client/home-town-view.js';
import {createBackTownView} from '../client/back-town-view.js';
import {createMountainArena} from '../client/mountain-arena.js';
import {createAlpineForest} from '../client/alpine-forest.js';
import {createKeepCornerGround} from '../client/keep-corner-ground.js';
import {createOrchardPresentation} from '../client/orchard-presentation.js';
import {backTownPiece,backTownPoint} from '../shared/keep-sites.js';
const q=new URLSearchParams(location.search),W=+q.get('w')||1280,H=+q.get('h')||720;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new T.Scene();const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.5;room.dispose();scene.background=new T.Color(0xa9c3d8);
scene.add(new T.HemisphereLight(0xe8f2ff,0x4a5a2a,1.3));const sun=new T.DirectionalLight(0xfff0d8,2.6);sun.position.set(-30,50,20);scene.add(sun);
// The real ground, dressed like the game: the 120 m ground mesh plus the keep-corner patches out past it, wearing the
// orchard presentation's material, with the mountain shell and its firs.
const g=new T.PlaneGeometry(120,120,160,160).rotateX(-Math.PI/2),pos=g.attributes.position;
for(let i=0;i<pos.count;i++)pos.setY(i,baseHeight(pos.getX(i),pos.getZ(i)));g.computeVertexNormals();
const ground=new T.Mesh(g,new T.MeshStandardMaterial({color:0x667b43,roughness:1}));scene.add(ground);
const orchard=createOrchardPresentation({scene,renderer,ground,sun,height:baseHeight,baseHeight,quality:'high',edits:[]});
orchard.objects.backdrop.visible=false; // the game swaps this for the alpine skyline
const corner=createKeepCornerGround({scene,ground,height:baseHeight});
const arena=createMountainArena({THREE:T,scene,height:baseHeight}),forest=createAlpineForest({scene,arena,quality:'high'});
const sim=createSimulation({seed:3});sim.addPlayer({id:'lab'});const view=createHomeBaseView({scene}),town=createHomeTownView({scene}),back=createBackTownView({scene});
const cam=new T.PerspectiveCamera(50,W/H,.1,400);let last=performance.now();
function frame(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);view.update(dt,cam,sim.snapshot().tick);town.update(dt);back.update(dt);corner.sync();orchard.update?.(dt,cam);last=now;renderer.render(scene,cam);}
const sync=()=>{const s=sim.snapshot();view.sync(s);town.sync(s);back.sync(s);};
const load=(url,fn)=>new Promise((ok,bad)=>new GLTFLoader().load(url,gl=>ok(fn(gl)),undefined,bad));
window.lab={sim,view,town,back,arena,
 loadKits:async()=>{const a=await load('/assets/bases_kit.glb',gl=>view.installKit(gl));const b=await load('/assets/town_kit.glb',gl=>town.installKit(gl));const d=await load('/assets/backtown_kit.glb',gl=>back.installKit(gl));
  const c=await load('/assets/keep_ballistas.glb',gl=>view.installKeepKit?.(gl)).catch(()=>false);sync();return [a,b,c,d];},
 // mode: 'top' straight down over the keep, 'aerial' from the lane, 'back' from behind over the pass, 'town' over the
 // back town from above the pass, 'street' at eye height in the yard, 'pass' at eye height looking up the pass.
 at:(side='party',mode='aerial')=>{const c=HOME_SITES[side],f=side==='party'?[1,1]:[-1,-1],n=Math.SQRT1_2;
  if(mode==='top'){cam.position.set(c[0]-f[0]*n*4,62,c[1]-f[1]*n*4);cam.up.set(f[0],0,f[1]);cam.lookAt(c[0]-f[0]*n*4,0,c[1]-f[1]*n*4);}
  else if(mode==='back'){cam.up.set(0,1,0);cam.position.set(c[0]-f[0]*n*26,16,c[1]-f[1]*n*26);cam.lookAt(c[0],1,c[1]);}
  else if(mode==='tavern'||mode==='hall'){cam.up.set(0,1,0);const t=homePiece(side,'tavern'),y=baseHeight(t.x,t.z);
   const [ex,ez]=pieceWorld(t,mode==='hall'?[3.2*TAVERN_SCALE,3.4*TAVERN_SCALE]:[0,12]),[lx,lz]=pieceWorld(t,mode==='hall'?[-1,-2*TAVERN_SCALE]:[0,0]);
   cam.position.set(ex,y+(mode==='hall'?1.7:5),ez);cam.lookAt(lx,y+(mode==='hall'?1.2:1.5),lz);}
  else if(mode==='town'||mode==='street'||mode==='pass'){cam.up.set(0,1,0);const w=backTownPiece(side,'workshop'),y=baseHeight(w.x,w.z);
   if(mode==='town'){cam.position.set(w.x+f[0]*11+f[1]*3,y+34,w.z+f[1]*11-f[0]*3);cam.lookAt(w.x+f[0]*4,y,w.z+f[1]*4);}
   else if(mode==='street'){const p=backTownPoint(side,[58.6,60.6]);cam.position.set(p[0],y+1.7,p[1]);cam.lookAt(w.x,y+1.6,w.z);}
   else{cam.position.set(c[0]-f[0]*n*20,baseHeight(c[0],c[1])+1.7,c[1]-f[1]*n*20);cam.lookAt(w.x,y+1.5,w.z);}}
  else{cam.up.set(0,1,0);cam.position.set(c[0]+f[0]*n*34+f[1]*n*10,20,c[1]+f[1]*n*34-f[0]*n*10);cam.lookAt(c[0]-f[0]*n*3,0,c[1]-f[1]*n*3);}
  sync();frame();},
 // A tavern from its own frame (id: tavern-party | tavern-rivals | tavern-neutral). mode 'front' from the yard,
 // 'inside' at eye height from the porch looking at the bar, 'hearth' beside the fire, 'roof' to see the chimney smoke.
 tavern:(id='tavern-party',mode='front')=>{sync();frame();const g=town.object.getObjectByName(id);if(!g)return false;g.updateMatrixWorld(true);
  const n=id==='tavern-neutral',hx=n?5.3:-3.8,hz=n?0:-.8,P=(x,y,z)=>new T.Vector3(x,y,z).applyMatrix4(g.matrixWorld);cam.up.set(0,1,0);
  const shot={front:[[2.5,3.4,n?11:9.5],[0,1.8,0]],inside:[[n?.1:.9,1.65,n?4.2:3.1],[-.2,1.4,n?-3.4:-2.6]],
   hearth:[[hx*.25,1.7,hz+(n?2.6:2.2)],[hx,1.0,hz]],roof:[[hx*2.6,6.5,hz+9],[hx,5,hz]]}[mode]||[[2.5,3.4,9.5],[0,1.8,0]];
  cam.position.copy(P(...shot[0]));cam.lookAt(P(...shot[1]));frame();return true;},
 smelt:(side='party',metal='iron')=>back.event({kind:'workshop_smelt',side,metal,ore:metal+'Ore',left:1,position:[0,0,0]}),
 step:n=>{for(let i=0;i<n;i++)sim.step();sync();},
 frame};
sync();
</script>

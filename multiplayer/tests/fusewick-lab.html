<!doctype html><html><head><meta charset="utf-8"><title>loading</title><style>html,body{margin:0;background:#9fb3c4}</style></head><body>
<script type="module">
// Review lab for the Fusewick sapper (client/fusewick-look.js on /assets/forgeling.glb), with an ordinary Forgeling beside it.
//   lab.view(name)   back | side | front | close
//   lab.light(u)     fuse burn 0..1 (-1 = unlit)
//   lab.frame(n)     advance and render
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {dressForgelingModel, prepareForgelingTemplate} from '../client/forgeling-look.js';
import {dressFusewick, animateFusewick} from '../client/fusewick-look.js';
import {FUSEWICK} from '../shared/warband.js';
const W=900,H=600,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x9fb3c4);const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.55;
scene.add(new T.HemisphereLight(0xc6e0ed,0x5e5139,1.2));const sun=new T.DirectionalLight(0xffe3ad,2.2);sun.position.set(-8,14,10);sun.castShadow=true;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(40,40).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x667b43,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const cam=new T.PerspectiveCamera(40,W/H,.02,100);
const gltf=await new GLTFLoader().loadAsync('/assets/forgeling.glb');prepareForgelingTemplate(gltf.scene);
const make=(id,role)=>{const v=gltf.scene.clone(true);const b=new T.Box3().setFromObject(v);v.scale.setScalar(1.81/(b.max.y-b.min.y));const g=new T.Group();g.add(v);scene.add(g);dressForgelingModel(v,id,role);if(role)dressFusewick(v);v.traverse(n=>{if(n.isMesh)n.castShadow=true;});return {g,v};};
const sap=make('e9','fusewick'),buddy=make('e3');buddy.g.position.x=-1.3;
let burn=-1,tick=0;const data={warband:{}};
const V={back:[[1.6,1.7,2.6],[0,1.15,0]],side:[[2.6,1.4,0],[0,1.1,0]],front:[[.8,1.5,-2.8],[-.4,1.05,0]],close:[[.7,1.6,1.1],[0,1.3,.2]]};
window.lab={view(n){cam.position.fromArray(V[n][0]);cam.lookAt(...V[n][1]);this.frame(1);},light(u){burn=u;},frame(n=1){for(let i=0;i<n;i++){tick++;data.warband.fuse=burn<0?undefined:tick-Math.round(burn*FUSEWICK.fuseTicks);animateFusewick(sap.v,data,tick,1/60);}renderer.render(scene,cam);}};
lab.view('back');document.title='ready';
</script></body></html>

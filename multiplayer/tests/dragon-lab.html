<!doctype html><meta charset="utf-8"><title>Dragon lab</title><style>body{margin:0;background:#8fb6d6}canvas{display:block}</style>
<script type="module">
// Review page for the streak dragon (client/dragon-art.js). await lab.ready() for the Blender model, then
// lab.view(name, t, opts) poses and renders one view; lab.rider(true) shows the rider's own dragon (see-through wings, no horns).
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {buildDragon,animateDragon,setRiderView,DRAGON_SCALE,DRAGON_SEAT,DRAGON_MOUTH} from '../client/dragon-art.js';
const q=new URLSearchParams(location.search),W=+(q.get('w')||1280),H=+(q.get('h')||800);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new T.Scene();const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.5;room.dispose();scene.background=new T.Color(0x9cc6e8);
scene.add(new T.HemisphereLight(0xe8f2ff,0x6a7a3a,1.3));const sun=new T.DirectionalLight(0xfff0d8,2.6);sun.position.set(-3,6,4);scene.add(sun);
const cam=new T.PerspectiveCamera(40,W/H,.05,200);const dragon=buildDragon();scene.add(dragon);
const mouth=new T.Mesh(new T.SphereGeometry(.12),new T.MeshBasicMaterial({color:0x00ff66}));mouth.position.fromArray(DRAGON_MOUTH).multiplyScalar(DRAGON_SCALE);mouth.visible=q.has('marks');dragon.add(mouth);
const views={three:[[9,4,9],[0,.5,0]],side:[[13,1,0],[0,.5,0]],front:[[0,1.5,12],[0,1,0]],below:[[3,-9,4],[0,0,0]],top:[[0,14,-1],[0,0,0]],face:[[2.2,3.2,8.5],[0,2,4]],
  saddle:[DRAGON_SEAT.map(n=>n*DRAGON_SCALE),[0,DRAGON_SEAT[1]*DRAGON_SCALE-2.6,DRAGON_SEAT[2]*DRAGON_SCALE+3.6]],saddleSide:[DRAGON_SEAT.map(n=>n*DRAGON_SCALE),[4,DRAGON_SEAT[1]*DRAGON_SCALE-2.8,DRAGON_SEAT[2]*DRAGON_SCALE+.5]]};
window.lab={
  ready:()=>new Promise(r=>{const t=setInterval(()=>{if(dragon.userData.dragon?.model){clearInterval(t);r(true);}},50);}),
  rider(on){setRiderView(dragon,on);},
  // Steps the animation from t0 to t in small increments (the lag filters integrate), then renders.
  view(name='three',t=0,opts={},{fov=40,from=null}={}){const t0=from??Math.max(0,t-3);for(let s=t0;s<t;s+=1/30)animateDragon(dragon,s,opts);animateDragon(dragon,t,opts);
    const [p,l]=views[name];cam.fov=fov;cam.updateProjectionMatrix();cam.position.set(...p);cam.lookAt(...l);renderer.render(scene,cam);},
  mouthWorld(){dragon.updateMatrixWorld(true);const b=dragon.userData.dragon.bones,j=b.Jaw,h=b.Head,v=new T.Vector3();
    // the tip of the upper lip and the tip of the lower jaw, averaged, in the dragon's unscaled local space
    const up=new T.Vector3(0,1.19,4.9),lo=new T.Vector3(0,1.08,4.85);return {head:h.getWorldPosition(v).clone().divideScalar(DRAGON_SCALE).toArray(),jaw:j.getWorldPosition(new T.Vector3()).divideScalar(DRAGON_SCALE).toArray()};},
  dragon,
};
document.title='ready';
</script>

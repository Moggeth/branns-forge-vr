<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../client/invention-panel.css"></head><body style="margin:0;background:#65754a"><script type="module">
import {createInventionPanel} from '../client/invention-panel.js';import {createSimulation} from '../shared/simulation.js';import {inventionView} from '../shared/inventions.js';

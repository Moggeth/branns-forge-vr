<!doctype html><meta charset="utf-8"><title>Apple lab</title><style>body{margin:0;background:#20242a}canvas{display:block}</style>
<script type="module">
// Review page for the apple-on-a-stick art (client/apple-art.js) and its held/bite motion (client/apple-snack.js).
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createSnackModel,setBites} from '../client/apple-art.js';
import {prepareProjectile} from '../client/asset-pose.js';
const W=1280,H=800,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new T.Scene();const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.55;room.dispose();scene.background=new T.Color(0x9fb3c4);
scene.add(new T.HemisphereLight(0xe8f2ff,0x5a4b2a,1.2));const sun=new T.DirectionalLight(0xfff0d8,2.8);sun.position.set(-2,4,3);sun.castShadow=true;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(20,20).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x5f7040,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const cam=new T.PerspectiveCamera(35,W/H,.01,100),loader=new GLTFLoader(),templates=new Map();
for(const n of ['arrow','crossbow'])templates.set(n,await loader.loadAsync(`/assets/${n}.glb`));
const snacks=[];
function clear(){for(const s of snacks){s.root.removeFromParent();s.dispose();}snacks.length=0;}
function add(stick,seed,bites,pos,yaw=0,pitch=0,half=false){const s=createSnackModel({stick,stickVisual:stick==='none'?null:prepareProjectile(templates,stick),seed,radius:.085,physical:true,half});s.root.position.set(...pos);s.root.rotation.set(pitch,yaw,0,'YXZ');s.root.traverse(o=>{if(o.isMesh){o.castShadow=true;}});setBites(s.apple.material,s.apple.spheres,bites,{age:2});scene.add(s.root);snacks.push(s);return s;}
window.lab={snacks,render:()=>renderer.render(scene,cam),
 row:(stick='arrow',seed=3)=>{clear();for(let i=0;i<4;i++)add(stick,seed,i,[(i-1.5)*.32,.25,0],Math.PI/2+.5,0);cam.position.set(0,.5,1.25);cam.lookAt(0,.22,0);renderer.render(scene,cam);},
 close:(bites=0,seed=3,stick='arrow',yaw=Math.PI/2+.4,roll=0)=>{clear();const s=add(stick,seed,bites,[0,.2,0],yaw,0);s.spin.rotation.z=roll;cam.position.set(0,.3,.42);cam.lookAt(0,.2,0);renderer.render(scene,cam);},
 halves:(bites=0,seed=4)=>{clear();for(const [i,y,p] of [[0,-.6,0],[1,2.4,0],[2,1.2,-Math.PI/2]]){const h=add('none',seed+i,bites,[(i-1)*.24,.1,0],y,0,true);if(p){h.root.rotation.set(0,0,p);h.root.position.y=.004;}}cam.position.set(0,.42,.62);cam.lookAt(0,.08,0);renderer.render(scene,cam);},
 half:(bites=1,seed=5,yaw=0,pitch=0)=>{clear();const h=add('none',seed,bites,[0,.2,0],yaw,pitch,true);cam.position.set(0,.3,.42);cam.lookAt(0,.2,0);renderer.render(scene,cam);},
 seeds:(n=6)=>{clear();for(let i=0;i<n;i++)add('none',i+1,0,[(i-(n-1)/2)*.22,.1,0],i);cam.position.set(0,.35,.95);cam.lookAt(0,.1,0);renderer.render(scene,cam);},
};
document.title='ready';
</script>

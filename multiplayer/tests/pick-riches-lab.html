<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick of Riches lab</title>
<style>html,body{margin:0;height:100%;background:#9fb6c4}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script type="module">
// Pick of Riches art lab: one Stonewhisper ridge per mineral row, real crystal-wall.js presentation on flat ground, fixed
// cameras for captures. ?view=side|close|end, ?tick=<ticks after cast>. Not shipped; the in-game check is crystal-wall-review.html.
import * as T from 'three';
import {createCrystalWall} from '../client/crystal-wall.js';
import {createSimulation,loadSimulation,terrainHeight} from '../shared/simulation.js';
const q=new URLSearchParams(location.search),kinds=(q.get('minerals')||'stone,iron,copper,crystal,gold,mithril,stone').split(',');
const renderer=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(0x9fb6c4);scene.fog=new T.Fog(0x9fb6c4,30,90);
scene.add(new T.HemisphereLight(0xdfeeff,0x5a4a32,1.4));const sun=new T.DirectionalLight(0xfff1d6,2.6);sun.position.set(-6,10,8);scene.add(sun);
const pmrem=new T.PMREMGenerator(renderer),env=new T.Scene();env.background=new T.Color(0x8fa9bd);env.add(new T.HemisphereLight(0xffffff,0x6b5a40,2));scene.environment=pmrem.fromScene(env).texture;
let sim=createSimulation({room:'RICHES_LAB'});sim.addPlayer({id:'h'});let s=sim.checkpoint();s.players[0].position=[0,terrainHeight(s,0,0),0];s.players[0].yaw=Math.PI/2;s.players[0].tool='pick';sim=loadSimulation(s);
const r=sim.command('h',{type:'action',action:'special',seq:1,point:[-8.7,0,0]});
s=sim.checkpoint();s.deposits.filter(d=>d.special==='pick_wall').forEach((d,i)=>{d.kind=kinds[i%kinds.length];d.maxHits={stone:3,iron:4,copper:4,crystal:5,gold:5,mithril:5}[d.kind];});sim=loadSimulation(s);
const ticks=+(q.get('tick')||150);for(let i=0;i<ticks;i++)sim.step();
const snap=sim.snapshot(),height=(x,z,edits)=>terrainHeight({...snap,edits:edits||snap.edits},x,z,false);
const ground=new T.Mesh(new T.PlaneGeometry(80,80,80,80).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x5f7d3a,roughness:1}));
{const p=ground.geometry.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));ground.geometry.computeVertexNormals();}scene.add(ground);
const wall=createCrystalWall({THREE:T,scene,height});wall.sync(snap);wall.update(0,snap.tick);
const cam=new T.PerspectiveCamera(50,1,.05,200),view=q.get('view')||'side';
const mid=snap.deposits.filter(d=>d.special==='pick_wall');const cx=mid.reduce((n,d)=>n+d.x,0)/mid.length,cz=mid.reduce((n,d)=>n+d.z,0)/mid.length;
if(view==='side'){cam.position.set(cx,2.6,7.5);cam.lookAt(cx,1.1,cz);}
else if(view==='close'){const d=mid[+(q.get('seg')||3)];cam.position.set(d.x+.6,2.4,d.z+3.4);cam.lookAt(d.x,1.3,d.z);}
else {cam.position.set(1.2,2.2,2.6);cam.lookAt(-6,1,0);}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}resize();addEventListener('resize',resize);
let frames=0;renderer.setAnimationLoop(()=>{wall.update(1/60,snap.tick);renderer.render(scene,cam);frames++;window.labReady=frames>3;});
window.lab={snap,stats:()=>wall.stats()};
</script></html>

<!doctype html><meta charset="utf-8"><title>32 Hero / 64 enemy render profile</title><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createHeroView} from '/client/hero-view.js';
import {prepareAsset} from '/client/asset-pose.js';
import {dressSkeleton} from '/client/skeleton-look.js';
import {updateEnemyMotion} from '/client/enemy-motion.js';
const scene=new T.Scene();scene.background=new T.Color('#9cab9d');const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(800,450);document.body.append(renderer.domElement);
const camera=new T.PerspectiveCamera(55,800/450,.1,150);camera.position.set(0,22,34);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xd2e7ff,0x665546,2));const sun=new T.DirectionalLight(0xffe9cc,3);sun.position.set(-10,18,8);scene.add(sun);
const loader=new GLTFLoader(),[hero,skeleton]=await Promise.all([loader.loadAsync('/assets/hero.glb'),loader.loadAsync('/assets/skeleton.glb')]);
const view=createHeroView();view.install(hero);const heroes=[],enemies=new Map();
for(let i=0;i<32;i++){const root=new T.Group();root.position.set(i%8*2.6-9.1,0,Math.floor(i/8)*2.5+2);const data={id:'p'+i,role:'hero',hp:100};if(i%2){data.head={position:[0,1.45,0],quaternion:[0,0,0,1]};data.hands=[{position:[-.3,1.1,-.4],quaternion:[0,0,0,1]},{position:[.3,1.3,-.4],quaternion:[0,0,0,1]}];}const visual=view.create(data);root.add(visual);scene.add(root);heroes.push({root,visual,data});}
for(let i=0;i<64;i++){const root=new T.Group(),visual=prepareAsset(skeleton,'skeleton').visual;dressSkeleton(visual,String(i));root.position.set(i%8*2.6-9.1,0,-Math.floor(i/8)*2.5-2);root.add(visual);scene.add(root);enemies.set('e'+i,{root,visual,enemy:true,data:{id:'e'+i,kind:'skeleton',hp:100,position:root.position.toArray(),yaw:0,attackTick:-1000,spawnTick:-1000}});}
const samples={heroes:[],enemies:[],submit:[],interval:[]};let previous=performance.now();
for(let f=0;f<25;f++){let t=performance.now();if(f>4)samples.interval.push(t-previous);previous=t;for(const p of heroes){p.root.position.z+=.02;view.update(p.visual,p.data,p.root,1/60,camera.position);}if(f>4)samples.heroes.push(performance.now()-t);t=performance.now();for(const p of enemies.values())p.root.position.z+=.01;updateEnemyMotion(enemies,{tick:f+200,dt:1/60,height:()=>0});if(f>4)samples.enemies.push(performance.now()-t);t=performance.now();renderer.render(scene,camera);if(f>4)samples.submit.push(performance.now()-t);await new Promise(requestAnimationFrame);}
function stats(a){a.sort((a,b)=>a-b);return{meanMs:a.reduce((a,b)=>a+b,0)/a.length,p95Ms:a[Math.floor(a.length*.95)]};}
const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');window.result={heroes:32,enemies:64,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),timings:Object.fromEntries(Object.entries(samples).map(([k,v])=>[k,stats(v)]))};window.ready=true;
</script>

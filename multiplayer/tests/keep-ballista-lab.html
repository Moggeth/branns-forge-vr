<!doctype html><html><head><meta charset="utf-8"><title>loading</title><style>html,body{margin:0;background:#9fb3c4}</style></head><body>
<script type="module">
// Review lab for the keep ballistas (2026-10-07): the real presentation (keep-ballista-art.js, keep-ballista-view.js) and
// the real shared flight on flat grass, with bone-white stand-in skeletons. The game renderer's tone mapping and lights.
//   lab.frame(n)          advance n 60 Hz frames and render
//   lab.view(name)        hero | sun | gnash | sunOp | gnashOp | sunBack | gnashSide | field
//   lab.scenario(name)    idle | drawn | perfect | loose | dawnbreak | spit | hooked | chomp | winding | sight
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createKeepBallistaView} from '../client/keep-ballista-view.js';
import {KEEP_BALLISTA, homeBallistaYaw, keepMuzzle, keepSpeed} from '../shared/home-ballista.js';
const W = innerWidth || 960, H = innerHeight || 540, renderer = new T.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.toneMapping = T.ACESFilmicToneMapping; renderer.outputColorSpace = T.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0x9fc0dc); const pmrem = new T.PMREMGenerator(renderer), room = new RoomEnvironment();
scene.environment = pmrem.fromScene(room, .04).texture; scene.environmentIntensity = .55; room.dispose();
scene.add(new T.HemisphereLight(0xc6e0ed, 0x5e5139, 1.2)); const sun = new T.DirectionalLight(0xffe3ad, 2.2); sun.position.set(-22, 38, 15); scene.add(sun);
scene.add(new T.Mesh(new T.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({color: 0x667b43, roughness: 1})));
const cam = new T.PerspectiveCamera(55, W / H, .05, 300); scene.add(cam);
const gltf = await new GLTFLoader().loadAsync('/assets/keep_ballistas.glb');
const view = createKeepBallistaView({root: scene, height: () => 0}); view.install(gltf);
// Two gate parts facing -Z (the view's world yaw 0): aimYaw cancels each side's rest heading.
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const part = (id, side, x) => ({id, kind: 'ballista', side, position: [x, 0, 0], hp: 300, maxHp: 300, readyTick: 0, aimYaw: wrap(-homeBallistaYaw(side)), aimPitch: .04});
const sunP = part('battle-base-party-ballista-0', 'party', -3.2), gnP = part('battle-base-rivals-ballista-0', 'rivals', 3.2);
const built = [sunP, gnP].map(data => { const g = new T.Group(); g.position.fromArray(data.position); g.rotation.y = 1.1; scene.add(g); const b = {group: g, data, kind: 'ballista', alive: 1}; view.adopt(b); return b; });
const bone = new T.MeshStandardMaterial({color: 0xe9e2cf, roughness: .7}), foes = [];
function addFoe(id, x, z) {
  const g = new T.Group(), mk = (geo, x, y, z) => { const m = new T.Mesh(geo, bone); m.position.set(x, y, z); g.add(m); return m; };
  mk(new T.CapsuleGeometry(.17, .5, 4, 10), 0, 1.1, 0); mk(new T.SphereGeometry(.15, 12, 10), 0, 1.65, 0);
  for (const s of [-1, 1]) { mk(new T.CapsuleGeometry(.05, .55, 3, 8), s * .34, 1.15, 0); mk(new T.CapsuleGeometry(.06, .7, 3, 8), s * .12, .42, 0); }
  g.position.set(x, 0, z); scene.add(g); const f = {id, hp: 100, kind: 'skeleton', position: [x, 0, z], m: g}; foes.push(f); return f;
}
addFoe('f1', -3.2, -16); addFoe('f2', -3.2, -22); const caught = addFoe('f3', 3.2, -9);
const snap = {tick: 0, enemies: foes, players: [], battle: {v: 2, status: 'running', bases: []}};
let tick = 0, frame = 0;
const fire = (p, extra = {}) => {
  const {at, forward} = keepMuzzle(p), v = keepSpeed(p, extra.charge || 0, extra.perfect), style = p.side === 'rivals' ? 'gnashjaw' : 'sunlance';
  const ev = {kind: 'keep_ballista_fire', id: `${p.id}:${tick}`, part: p.id, side: p.side, style, o: at, v: forward.map(k => k * v), tick, charge: extra.charge || 0, perfect: !!extra.perfect};
  p.readyTick = tick + 150; p.fireTick = tick; delete p.drawTick; view.event(ev); return ev;
};
const SCEN = {
  idle() { for (const p of [sunP, gnP]) { p.readyTick = 0; delete p.drawTick; delete p.hook; } view.setLocalDraw(sunP.id, null); view.sight(null); },
  drawn() { SCEN.idle(); sunP.drawTick = tick - 50; },
  perfect() { SCEN.idle(); sunP.drawTick = tick - KEEP_BALLISTA.sunlance.drawTicks - 4; },
  loose() { SCEN.idle(); const ev = fire(sunP, {charge: .8}); return ev; },
  dawnbreak() { SCEN.idle(); fire(sunP, {charge: 1, perfect: true}); },
  spit() { SCEN.idle(); fire(gnP); },
  hooked() { SCEN.idle(); gnP.hook = {target: 'f3', hero: false, tick, shot: 'x', off: [0, 1.1, .2]}; gnP.readyTick = tick + 60; },
  chomp() { SCEN.hooked(); view.event({kind: 'keep_ballista_chomp', part: gnP.id, side: 'rivals', target: 'f3', position: caught.position}); delete gnP.hook; },
  winding() { SCEN.idle(); sunP.readyTick = tick + 90; sunP.fireTick = tick - 40; gnP.readyTick = tick + 90; gnP.fireTick = tick - 40; sunP.crankUntil = tick + 9999; },
  sight() { SCEN.idle(); sunP.drawTick = tick - 40; },
};
let sighting = null;
const VIEWS = {hero: [[0, 3.4, -9.5], [0, 1.5, 0]], sun: [[-.6, 2.3, -4.2], [-3.2, 1.6, 0]], gnash: [[5.4, 2.2, -3.6], [3.2, 1.7, 0]],
  sunOp: [[-3.2, 1.9, 1.75], [-3.2, 1.4, -14]], gnashOp: [[3.2, 2.75, 1.75], [3.2, 1.3, -14]], sunBack: [[-6.5, 3, 3.6], [-3.2, 1.5, 0]], gnashSide: [[7.2, 2.2, .2], [3.2, 1.6, 0]],
  field: [[11, 6, -2], [0, 1.2, -12]]};
window.lab = {
  frame(n = 1) { for (let i = 0; i < n; i++) { tick++; frame++; snap.tick = tick; view.sync(snap); view.update(1 / 60, tick, cam);
    if (sighting) view.sight(sunP, {yaw: sunP.aimYaw, pitch: sunP.aimPitch}, {charge: .6, visible: true}); }
    renderer.render(scene, cam); return view.stats(); },
  view(name) { const [p, at] = VIEWS[name]; cam.position.fromArray(p); cam.lookAt(...at); cam.updateMatrixWorld(); return name; },
  scenario(name) { sighting = name === 'sight'; return SCEN[name](); },
  aim(yaw, pitch) { for (const p of [sunP, gnP]) { p.aimYaw = wrap(-homeBallistaYaw(p.side) + yaw); p.aimPitch = pitch; } },
  stats: () => view.stats(), info: () => ({tick, renderer: renderer.info.render})};
lab.view('hero'); lab.frame(2); document.title = 'ready';
</script></body></html>

<!doctype html><meta charset="utf-8"><title>Salt deposit review</title><style>body{margin:0;background:#140c10}canvas{display:block}</style>
<script type="module">
// Review page for the Brinedeep salt deposits (seam, heart, rubble) and the loose salt pickup, in a dark salt cave
// lit by one lantern and in plain daylight. window.saltReview.{cave,day,far,close,stats}().
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createResourceArt} from '../client/forest-resource-art.js';
const W=1280,H=800,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment(),env=pmrem.fromScene(room,.04).texture;room.dispose();pmrem.dispose();
const hemi=new T.HemisphereLight(0xf0f4ff,0x756a3a,1.6),sun=new T.DirectionalLight(0xfff0d8,2.6);sun.position.set(-8,12,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});
const lantern=new T.PointLight(0xffb468,6,14,1.6);lantern.position.set(-6.5,2.6,2.5);const caveFill=new T.HemisphereLight(0x5a3848,0x140a0c,.35);scene.add(hemi,sun,lantern,caveFill);
const ground=new T.Mesh(new T.PlaneGeometry(200,200).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x6f7a4a,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const wall=new T.Mesh(new T.PlaneGeometry(60,14),new T.MeshStandardMaterial({color:0x6a4a50,roughness:.95}));wall.position.set(0,7,-3.2);wall.receiveShadow=true;scene.add(wall);
const camera=new T.PerspectiveCamera(48,W/H,.1,300),art=createResourceArt();
const row=[['salt',0,-5.1],['saltHeart',0,-1.7],['saltRubble',0,1.6],['salt',1,4.8]];
for(const [kind,variant,x] of row){const root=art.deposit(kind,{variant});root.position.set(x,0,0);root.rotation.y=.4+variant*1.9;scene.add(root);}
for(const [n,s] of [[0,2.6],[1,1]]){const p=art.pickup('salt');p.position.set(n?1.2:-1.2,0,2.6);p.scale.setScalar(s);p.rotation.y=n*1.3;scene.add(p);}
let mode='cave';
function setMode(m){mode=m;const cave=m==='cave';hemi.visible=sun.visible=!cave;lantern.visible=caveFill.visible=cave;scene.environment=env;scene.environmentIntensity=cave?.06:.55;
 scene.background=new T.Color(cave?0x120a0e:0xa9bfcb);ground.material.color.set(cave?0x3a2a2c:0x6f7a4a);wall.visible=cave;}
const view=(pos,look,t)=>{camera.position.set(...pos);camera.lookAt(...look);camera.updateMatrixWorld();art.update(t);renderer.render(scene,camera);};
window.saltReview={stats:()=>art.stats(),cave:()=>{setMode('cave');view([0,3.4,8.2],[0,.6,0],1.2);},day:()=>{setMode('day');view([0,3.4,8.2],[0,.6,0],1.2);},
 far:m=>{setMode(m||mode);view([0,1.7,10.5],[-1.7,.6,0],1.4);},close:m=>{setMode(m||mode);view([-1.7,1.6,2.6],[-1.7,.7,0],2);},look:(m,pos,at)=>{setMode(m);view(pos,at,2.4);}};
setMode('cave');await renderer.compileAsync(scene,camera);window.saltReview.cave();document.title='ready';
</script>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#1f2929;color:#e9d7b1;font:15px system-ui}h2{margin:16px 24px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}article{text-align:center}canvas{width:100%;aspect-ratio:1.4}p{margin:0}</style><h2>Brann’s Forge · Physical Inventions · Runtime models</h2><div id="grid"></div><script type="module">
import * as THREE from 'three';import {createInventionModel,animateInventionModel,INVENTION_TYPES,countInventionMeshes} from '../client/invention-art.js';
const grid=document.querySelector('#grid');window.budgets=[];for(const type of INVENTION_TYPES){const a=document.createElement('article'),canvas=document.createElement('canvas'),label=document.createElement('p');a.append(canvas,label);grid.append(a);label.textContent=type;const r=new THREE.WebGLRenderer({canvas,antialias:true});r.setSize(440,315,false);r.setPixelRatio(1);r.setClearColor(0x27322f);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xfff1d8,0x45535d,2));const sun=new THREE.DirectionalLight(0xffefc9,3);sun.position.set(4,8,5);scene.add(sun);const model=createInventionModel(type);scene.add(model);animateInventionModel(model,{time:2,progress:1,active:true,open:.4,armed:true});const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),scale=Math.max(size.x,size.y,size.z)*.8;const camera=new THREE.OrthographicCamera(-scale*1.4,scale*1.4,scale,-scale,.1,100);camera.position.copy(center).add(new THREE.Vector3(6,4,7));camera.lookAt(center);const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x39453c}));floor.rotation.x=-Math.PI/2;floor.position.y=-.12;scene.add(floor);r.render(scene,camera);window.budgets.push({type,meshes:countInventionMeshes(model),triangles:r.info.render.triangles});}window.ready=true;
</script>

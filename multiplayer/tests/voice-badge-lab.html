<!doctype html><meta charset="utf-8"><title>Voice speaking badge lab</title>
<style>html,body{margin:0;height:100%;background:#9cc4e4}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script type="module">
// Lab: speaking badges over stand-in players at 3, 10 and 25 m. ?quiet shows none talking.
import * as THREE from 'three';
import {createVoiceIndicators} from '../client/voice-indicators.js';
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});renderer.setPixelRatio(1);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc4e4);scene.add(new THREE.HemisphereLight(0xffffff,0x557744,2.4));
const camera=new THREE.PerspectiveCamera(70,1,.1,200);camera.position.set(0,1.65,0);camera.lookAt(0,1.4,-10);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x7aa35a}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const players=new Map([['near',[-1.4,0,-3]],['mid',[2.5,0,-10]],['far',[-6,0,-25]]].map(([id,p])=>{const g=new THREE.Group();g.position.fromArray(p);
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(.32,1.1,4,10),new THREE.MeshLambertMaterial({color:0xd08a4a}));body.position.y=.9;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),new THREE.MeshLambertMaterial({color:0xf0c9a0}));head.position.y=1.75;g.add(head);scene.add(g);return [id,g];}));
const badges=createVoiceIndicators({scene});const talking=new Set(new URLSearchParams(location.search).has('quiet')?[]:['near','far']);
let last=performance.now();
function frame(now){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  badges.update((now-last)/1000,now/1000,talking,id=>players.get(id)?.position||null,h);last=now;renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.badgeCount=()=>badges.count();
</script>

<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Salt mine in game</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<script type="module">
// The real game renderer (client/game.js) on a real in-page simulation, with a Hero standing in (or outside) the east
// salt mine. Positions are in the mine's corner space ([u, v], shared/salt-mines.js). window.lab drives review captures:
// lab.advance(ticks), lab.place([u,v], lookAt [u,v]), lab.mine() (the view's diagnostics). ?touch for the phone
// layout, ?manual to freeze time between advances, ?side=west for the other mine, ?god for the God's view.
import * as THREE from 'three';
import {createGame} from '../client/game.js';
// Catch the game's scene for review toggles (lab.hide('mountain-arena')).
let labScene=null;{const add=THREE.Scene.prototype.add;THREE.Scene.prototype.add=function(...o){labScene=labScene||this;return add.apply(this,o);};}
import {createSimulation,loadSimulation,terrainHeight} from '../shared/simulation.js';
import {minePoint,MINE} from '../shared/salt-mines.js';
import {createSaltback,poolPoint} from '../shared/salt-mine-rules.js';
const params=new URLSearchParams(location.search),touch=params.has('touch'),manual=params.has('manual'),side=params.get('side')||'east';
const spot=(params.get('at')||'58,56.5').split(',').map(Number),look=(params.get('look')||'60.5,59.5').split(',').map(Number);
let sim=createSimulation({room:'LAB',seed:Number(params.get('seed')||41)});sim.addPlayer({id:'me',name:'Lab',role:params.has('god')?'god':'hero'});
let faceYaw=0;
function place(at,to){const c=sim.checkpoint(),p=c.players[0],[x,z]=minePoint(side,at),[tx,tz]=minePoint(side,to);p.position=[x,terrainHeight(c,x,z),z];p.yaw=faceYaw=Math.atan2(-(tx-x),-(tz-z));if(params.has('tick'))c.tick=Number(params.get('tick'));if(params.has('nocrabs'))c.enemies=c.enemies.filter(e=>e.kind!=='saltback');if(params.has('king')){const[kx,kz]=poolPoint(side,MINE.lake),k=createSaltback('crabKing',side,MINE.lake,Math.max(0,c.tick-300),c.seed|0,terrainHeight(c,kx,kz),true),[ax,az]=String(params.get('king')).split(',').map(Number),[px,pz]=Number.isFinite(az)?minePoint(side,[ax,az]):[kx,kz];k.position=[px,terrainHeight(c,px,pz),pz];k.yaw=Math.atan2(-(x-px),-(z-pz));c.enemies.push(k);}sim=loadSimulation(c);}
place(spot,look);
let seq=1,pending=[],last=performance.now();
const canvas=document.getElementById('c');
const game=createGame({canvas,isHost:()=>true,onAction:(action,d={})=>{const r=sim.command('me',{type:'action',seq:seq++,action,...d});pending.push(...(r.events||[]));},
  onInput:input=>sim.command('me',{type:'input',seq:seq++,...input}),onCast:()=>{},onStatus:m=>{window.lastStatus=m;}});
game.setTouchEnabled(touch);
function pump(){const now=performance.now();let n=Math.min(12,Math.round((now-last)/16.667));last+=n*16.667;for(let i=0;i<n;i++)pending.push(...sim.step());game.applySnapshot(sim.snapshot(),'me');for(const e of pending)game.handleEvent(e);pending=[];}
function advance(n){for(let i=0;i<n;i++)pending.push(...sim.step());game.applySnapshot(sim.snapshot(),'me');for(const e of pending)game.handleEvent(e);pending=[];}
if(!manual)setInterval(pump,50);advance(1);
window.lab={game,advance,place,look:(y,p)=>game.setLook(y,p),sim:()=>sim,setSim:s=>{sim=s;},command:m=>sim.command('me',{seq:seq++,...m}),mine:()=>({...game.diagnostics().saltMines,tick:sim.snapshot().tick}),controls:()=>game.controlsSnapshot(),scene:()=>labScene,hide:(...names)=>{for(const n of names)labScene.getObjectByName(n)&&(labScene.getObjectByName(n).visible=false);},names:()=>labScene.children.map(c=>c.name||c.type)};
game.setActive(true);
const wait=()=>new Promise(r=>{const t=setInterval(()=>{if(game.diagnostics().startup.ready){clearInterval(t);r();}},100);});
await wait();game.setActive(true);game.setLook(faceYaw+Number(params.get('turn')||0),Number(params.get('pitch')||-.1));document.title='ready';
</script>

<!doctype html><html lang="en"><meta charset="utf-8"><title>Golem studio</title>
<style>body{margin:0;background:#9fb3bd}canvas{display:block}</style>
<script type="module">
// Golem model review: game lighting/tonemapping, four turntable views in one frame. ?glb=/assets/golem.glb&dusk
// Not shipped. Shares prepareAsset so scale/pivot match the game.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {prepareAsset} from '../client/asset-pose.js';
const q=new URLSearchParams(location.search),W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(W,H);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.setScissorTest(true);document.body.append(r.domElement);
const s=new THREE.Scene(),dusk=q.has('dusk');s.background=new THREE.Color(dusk?0x2a3448:0xa9c0cc);
s.add(new THREE.HemisphereLight(dusk?0x5a6a90:0xc6e0ed,0x5e5139,dusk?.5:1.2));const sun=new THREE.DirectionalLight(dusk?0x9fb0ff:0xffe3ad,dusk?.6:2.2);sun.position.set(6,10,5);s.add(sun);
const g=new THREE.Mesh(new THREE.CircleGeometry(4,32).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x6b7a3a,roughness:1}));s.add(g);
new GLTFLoader().load(q.get('glb')||'/assets/golem.glb',gltf=>{
 const {visual}=prepareAsset(gltf.scene?gltf:gltf,'golem',2.8);s.add(visual);
 if(q.get('armor')!==null){const a=+q.get('armor');for(const[n,t]of[['ForearmL',3],['ForearmR',3],['ShoulderL',2],['ShoulderR',2],['ChestPlate',1]]){const o=visual.getObjectByName(n);if(o)o.visible=a>=t;}}
 const views=[[0,1.6,4.6,1.5],[Math.PI*.25,1.8,5,1.5],[Math.PI,1.8,5,1.5],[Math.PI*-.15,2.35,1.9,2.25]];
 const cam=new THREE.PerspectiveCamera(40,(W/2)/(H/2),.05,50);
 views.forEach(([a,y,d,ty],i)=>{const x=(i%2)*W/2,yy=(i<2?H/2:0);r.setViewport(x,yy,W/2,H/2);r.setScissor(x,yy,W/2,H/2);cam.position.set(Math.sin(a)*d,y,-Math.cos(a)*d);cam.lookAt(0,ty,0);r.render(s,cam);});
 document.title='ready';});
</script></html>

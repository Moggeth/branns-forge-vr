<!doctype html><meta charset="utf-8"><title>Import gameplay acceptance</title><style>body{margin:0;background:#222;color:white;font:14px system-ui}header{height:100px;padding:8px}button{padding:9px;margin:3px}canvas{width:100vw;height:calc(100vh - 120px);display:block}pre{margin:0;white-space:pre-wrap}</style>
<header><button id="run">Run acceptance</button><button id="tree">Tree scene</button><button id="mine">Mine scene</button><button id="swing">Swing</button><button id="collect">Collect</button><button id="bridge">Bridge</button><button id="god">God view</button><button id="meteor">Starfall</button><pre id="state"></pre></header><canvas id="world"></canvas>
<script type="module">
import {createSimulation,loadSimulation,terrainHeight} from '../shared/simulation.js';import {createGame} from '../client/game.js';
let sim,seq=0,game;const output=document.querySelector('#state');let errors=[],results=[],lastAction=null;window.addEventListener('error',e=>{errors.push(e.message);});
function reset(which){game?.dispose();sim=createSimulation({seed:41});sim.addPlayer({id:'hero'});sim.addPlayer({id:'god',role:'god'});let s=sim.checkpoint();s.players[0].position=which==='mine'?[-5,terrainHeight(s,-5,7),7]:[-2,terrainHeight(s,-2,8),8];s.players[0].tool=which==='mine'?'pick':'axe';sim=loadSimulation(s);seq=0;game=createGame({canvas:document.querySelector('canvas'),onInput:input=>sim.command('hero',{type:'input',seq:++seq,...input}),onAction:(action,details={})=>{lastAction={action,...details};const r=sim.command('hero',{type:'action',seq:++seq,action,...details});for(const e of r.events)game.handleEvent(e);if(!r.ok)errors.push(r.code);},onCast:(spell,point)=>sim.command('god',{type:'cast',seq:++seq,spell,point})});game.setActive(true);game.applySnapshot(sim.snapshot(),'hero');if(which==='mine')game.lookByPixels(0,140);}
document.querySelector('#run').onclick=async()=>{results=[];const delay=ms=>new Promise(r=>setTimeout(r,ms));reset('tree');await delay(1800);for(let i=0;i<3;i++){game.strike();await delay(550);}results.push({treeFelled:sim.snapshot().harvestedTrees.some(t=>t.cuts===3)});game.interact();game.interact();game.buildBridge();await delay(200);results.push({bridge:sim.snapshot().bridges.length===1});reset('mine');await delay(1800);for(let i=0;i<3;i++){game.strike();await delay(570);}results.push({oreMined:sim.snapshot().deposits[0].depleted});game.interact();results.push({stoneCollected:sim.snapshot().players[0].resources.stone===2});};
reset('tree');let previous=performance.now(),acc=0;
setInterval(()=>{const now=performance.now();acc+=Math.min(.1,(now-previous)/1000);previous=now;while(acc>=1/60){for(const e of sim.step())game.handleEvent(e);acc-=1/60;}game.applySnapshot(sim.snapshot(),'hero');const s=sim.snapshot();output.textContent=JSON.stringify({cuts:s.harvestedTrees,ore:s.deposits[0],loot:s.pickups.length,resources:s.players[0].resources,bridges:s.bridges.length,errors,results,lastAction});},50);
for(const id of ['tree','mine'])document.querySelector('#'+id).onclick=()=>reset(id);
document.querySelector('#swing').onclick=()=>game.strike();document.querySelector('#collect').onclick=()=>game.interact();document.querySelector('#bridge').onclick=()=>game.buildBridge();document.querySelector('#god').onclick=()=>game.setRole('god');document.querySelector('#meteor').onclick=()=>{sim.command('god',{type:'cast',seq:++seq,spell:'starfall',point:[-5,0,5]});};
</script>

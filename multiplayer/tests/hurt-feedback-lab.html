<!doctype html><html><head><meta charset="utf-8"><title>loading</title>
<link rel="stylesheet" href="../lobby.css">
<style>html,body{margin:0;background:#9fb3c4;overflow:hidden}#hud{position:fixed;left:14px;top:12px;width:230px;padding:10px 12px;border-radius:12px;background:rgba(20,16,12,.82);color:#f3e7d3;font:14px system-ui}
#cap{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#fff;font:600 17px system-ui;text-shadow:0 1px 4px #000}</style></head><body>
<div id="hud"><div class="meter hp" title="Health"><span class="meter-label">HP</span><span class="meter-track"><span id="hpFill" class="meter-fill"></span></span><span id="hpText" class="meter-value">100 / 100</span></div></div>
<div id="cap"></div>
<script type="module">
// Review of the hurt feedback (client/hurt-feedback.js, client/hero-hurt-flash.js): a first-person view in a meadow at
// dusk, blows landing from the left, from behind and ahead, health falling into the low-health glow, and another Hero
// a few metres away flashing as they are struck. lab.frame() advances one 60 Hz frame and renders it.
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {createHurtFeedback} from '../client/hurt-feedback.js';
import {createHeroView} from '../client/hero-view.js';
const W=innerWidth,H=innerHeight,renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;document.body.prepend(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x9cb8d0);scene.fog=new T.Fog(0x9cb8d0,18,70);
scene.add(new T.HemisphereLight(0xe8f2ff,0x5a4b2a,1.4));const sun=new T.DirectionalLight(0xfff0d8,2.6);sun.position.set(-4,8,3);scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(200,200).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x5f7a3c,roughness:1}));scene.add(ground);
for(let i=0;i<40;i++){const a=i*2.4,r=8+(i*7.3)%30,t=new T.Mesh(new T.ConeGeometry(1.2,4,7),new T.MeshStandardMaterial({color:0x2f5a2c,roughness:1}));t.position.set(Math.sin(a)*r,2,Math.cos(a)*r-6);scene.add(t);}
const rig=new T.Group();scene.add(rig);const cam=new T.PerspectiveCamera(70,W/H,.05,180);cam.rotation.order='YXZ';cam.position.set(0,1.65,0);rig.add(cam);
const me={id:'me',role:'hero',hp:100,maxHp:100};
const fx=createHurtFeedback({camera:cam,self:()=>me});
const fill=document.getElementById('hpFill'),text=document.getElementById('hpText'),cap=document.getElementById('cap');
const heroes=createHeroView();let other=null,otherRoot=null;const otherData={id:'friend',role:'hero',hp:100,tool:'axe',position:[1.6,0,-4]};
new GLTFLoader().load('../public/assets/hero.glb',g=>{heroes.install(g);otherRoot=new T.Group();otherRoot.position.set(1.6,0,-4);otherRoot.rotation.y=Math.PI*.85;scene.add(otherRoot);other=heroes.create(otherData);otherRoot.add(other);document.title='ready';},undefined,()=>{document.title='ready';});
function hit(n,deg,label){const a=deg*Math.PI/180;me.hp=Math.max(1,me.hp-n);fill.style.transform=`scaleX(${me.hp/100})`;text.textContent=`${me.hp} / 100`;
  fx.hurt({kind:'hit',hero:true,id:'me',damage:n,from:[Math.sin(a)*3,1,-Math.cos(a)*3]},{position:new T.Vector3(0,1.65,0),yaw:0});if(label)cap.textContent=label;}
const script={20:()=>hit(12,-90,'Hit from the left'),110:()=>hit(18,180,'Hit from behind: bottom edge'),200:()=>hit(10,40,'Hit ahead and to the right'),
  290:()=>{otherData.hp=70;cap.textContent='Another Hero is struck'},380:()=>hit(38,-30,'Heavy blow: now below 30%'),400:()=>cap.textContent='Low health: edge breathes with a heartbeat',
  560:()=>{otherData.hp=40;}};
let frame=0;
window.lab={frame(){script[frame]?.();cam.rotation.set(-.05,0,0);fx.update(1/60);if(other)heroes.update(other,otherData,otherRoot,1/60,cam.getWorldPosition(new T.Vector3()));renderer.render(scene,cam);frame++;return frame;}};
</script></body></html>

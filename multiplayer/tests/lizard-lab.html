<!doctype html><html><head><meta charset="utf-8"><title>loading</title><style>html,body{margin:0;background:#9fb3c4}</style></head><body>
<script type="module">
// Review lab for the Stormspire lizard crew (level 2, 2026-10-07; production pass): the real tower presentation (stormspire-art.js with
// /assets/stormspire.glb) and its crew (stormspire-lizards.js with /assets/stormspire-lizard.glb), plus a close-up
// showcase of the three looks on a slab beside the tower.
//   lab.frame(n)            advance n 60 Hz frames and render
//   lab.view(name)          camera: tower front hopper hopper-side hopper-far brim far climber climber-close show show-face show-mid show-front show-profile show-side show-back show-top
//   lab.charge()            charge the tower (the crew cheers)
//   lab.show(clip)          showcase lizards play a clip from its start (idle climb cheer nap tinker bite)
//   lab.size(w, h)          resize (e.g. 390 x 844 for a phone)
//   lab.near(who, off, aim) camera in a crew newt's own frame (who Sparky Sprocket Snooze; x right, y up off its belly, z back)
//   lab.feet()              every crew boot sole's height above the surface it stands on (after the IK)
//   lab.solo(k)             show only showcase newt k (0..2) at the centre of the slab (lab.solo(-1) restores all three)
//   lab.orbit(az, el, d, y, dz) camera orbiting the slab centre (+dz along it; the heads are at dz -.3): azimuth (0 = in front of the newts), elevation, distance, aim height
//   lab.stats()             draw calls, triangles
//   lab.springs()           the middle showcase newt's secondary-motion springs
//   lab.probe(bone), lab.track(clip, bone)   debugging: a showcase bone's pose and clip track
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createStormspireArt} from '../client/stormspire-art.js';
import {createLizardModel} from '../client/stormspire-lizards.js';
let W=960,H=540;const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x9fb3c4);const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;scene.environmentIntensity=.55;room.dispose();
scene.add(new T.HemisphereLight(0xc6e0ed,0x5e5139,1.2));const sun=new T.DirectionalLight(0xffe3ad,2.2);sun.position.set(-22,38,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:80});sun.shadow.bias=-.0005;scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(120,120).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x667b43,roughness:1}));ground.receiveShadow=true;scene.add(ground);
const cam=new T.PerspectiveCamera(55,W/H,.02,200);scene.add(cam);
const art=createStormspireArt({}),loader=new GLTFLoader();
const tower=await loader.loadAsync('/assets/stormspire.glb');art.install(tower);
const b={id:'s1',type:'stormspire',position:[0,0,0],yaw:0,hp:240,charge:120,operator:null,operator2:null,side:'party'};
const e={root:new T.Group(),data:b};scene.add(e.root);art.attach(e);
// showcase: the three looks side by side on a stone slab beside the tower
const SHOW=new T.Vector3(5,0,-3),slab=new T.Mesh(new T.BoxGeometry(1.6,.2,.8),new T.MeshStandardMaterial({color:0x8a8f96,roughness:.9}));slab.position.copy(SHOW).setY(.1);slab.receiveShadow=true;scene.add(slab);
const shows=[];for(let k=0;k<3;k++){const l=await createLizardModel(k);if(!l)break;l.group.position.set(SHOW.x+(k-1)*.62,.2,SHOW.z);scene.add(l.group);l.play('idle');shows.push(l);}
let frame=0;const crew=()=>e.spire?.crew;let follow=null;
const VIEWS={tower:[[0,3.2,-9.5],[0,3.4,0]],front:[[2.2,2.6,-5.2],[0,2.4,0]],hopper:[[1.25,1.5,-2.75],[.36,1.12,-1.62]],'hopper-side':[[1.45,1.25,-1.45],[.38,1.1,-1.62]],'hopper-far':[[2.2,1.9,-4.2],[.2,1.2,-1.5]],brim:[[1.1,5.95,-2.7],[0,5.55,-1.1]],far:[[3,2.2,-12],[0,3,0]],
  show:[[SHOW.x+.55,.75,SHOW.z-1.75],[SHOW.x,.36,SHOW.z]],'show-side':[[SHOW.x+.3,.5,SHOW.z+1.6],[SHOW.x,.36,SHOW.z]],'show-top':[[SHOW.x+.1,1.7,SHOW.z-.5],[SHOW.x,.25,SHOW.z]],
  'show-mid':[[SHOW.x+.42,.5,SHOW.z-.82],[SHOW.x,.4,SHOW.z-.2]],'show-front':[[SHOW.x,.46,SHOW.z-.9],[SHOW.x,.4,SHOW.z-.2]],'show-face':[[SHOW.x+.05,.47,SHOW.z-.62],[SHOW.x,.4,SHOW.z-.2]],
  'show-profile':[[SHOW.x+.95,.42,SHOW.z-.1],[SHOW.x,.33,SHOW.z]],'show-back':[[SHOW.x-.55,.75,SHOW.z+.85],[SHOW.x,.3,SHOW.z]]};
function setView(name){follow=null;if(name==='climber'||name==='climber-close'){follow=name==='climber'?1.6:.8;return;}const v=VIEWS[name];cam.position.fromArray(v[0]);cam.lookAt(new T.Vector3(...v[1]));}
function render(){
  if(follow){const h=e.spire.root.getObjectByName('Lizard_Sparky');if(h){const p=h.getWorldPosition(new T.Vector3()),out=new T.Vector3(p.x,0,p.z).normalize();const tan=new T.Vector3(-out.z,0,out.x);cam.position.copy(p).addScaledVector(out,follow).addScaledVector(tan,follow<1?.35:0).add(new T.Vector3(0,follow<1?.25:.5,0));cam.lookAt(p.clone().add(new T.Vector3(0,.05,0)));}}
  renderer.render(scene,cam);}
window.lab={scene,e,T,
  frame(n=1){for(let i=0;i<n;i++){frame++;const t=frame/60,dt=1/60;art.animate(e,t,dt);for(const l of shows)l.update(t,dt,cam.position);}render();return frame;},
  view(name){setView(name);render();},
  charge(){art.charged(e);},
  show(clip){for(const l of shows)l.play(clip);},
  size(w,h){W=w;H=h;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();render();},
  probe(bone){const m=shows[1].model,b=m.bones[bone];return{q:b.quaternion.toArray().map(v=>+v.toFixed(3)),rest:m.rest[bone].q.toArray().map(v=>+v.toFixed(3)),clip:m.clip,w:Object.fromEntries(Object.entries(m.actions).map(([k,a])=>[k,+a.getEffectiveWeight().toFixed(2)])),tracks:m.actions[m.clip]?.getClip().tracks.filter(t=>t.name.startsWith(bone)).map(t=>t.name)};},
  track(clip,bone){const t=shows[1].model.actions[clip].getClip().tracks.find(t=>t.name.startsWith(bone));return{times:Array.from(t.times),values:Array.from(t.values).map(v=>+v.toFixed(3)),type:t.constructor.name,interp:t.getInterpolation()};},
  springs(){const m=shows[1].model,r=v=>+v.toFixed(3);return{clip:m.clip,hat:[r(m.hat.p.x),r(m.hat.r.x)],tailY:m.tailY.map(s=>r(s.x)),tailP:m.tailP.map(s=>r(s.x)),belly:r(m.belly.x),cheek:r(m.cheek.x)};},
  near(who,off,aim=[0,.12,0]){follow=null;const h=e.spire.root.getObjectByName('Lizard_'+who);h.updateWorldMatrix(true,false);cam.position.copy(h.localToWorld(new T.Vector3(...off)));cam.up.copy(new T.Vector3(0,1,0));cam.lookAt(h.localToWorld(new T.Vector3(...aim)));render();},
  feet(){return e.spire.crew?.group?.userData.lizardFeet?.()??e.spire.root.getObjectByName('LizardCrew')?.userData.lizardFeet?.();},
  solo(k){shows.forEach((l,i)=>{l.group.visible=k<0||i===k;l.group.position.x=SHOW.x+(k<0?(i-1)*.62:0);});render();},
  orbit(az,el,d,y=.3,dz=0){follow=null;const z=SHOW.z+dz;cam.position.set(SHOW.x+Math.sin(az)*Math.cos(el)*d,y+Math.sin(el)*d,z-Math.cos(az)*Math.cos(el)*d);cam.lookAt(SHOW.x,y,z);render();},
  stats(){renderer.info.reset;render();return{calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,frame,model:!!shows.length};},
};
setView('front');lab.frame(1);document.title='ready';
</script></body></html>

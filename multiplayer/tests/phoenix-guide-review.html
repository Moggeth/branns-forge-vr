<!doctype html><meta charset="utf-8"><title>Phoenix guide depth acceptance</title><style>body{margin:0}canvas{display:block}</style><script type="module">
import * as T from 'three';import {createTrajectoryGuide} from '../client/ranged-trajectory.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(900,500);document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#65785a');const camera=new T.PerspectiveCamera(45,900/500,.1,100);camera.position.set(0,0,8);camera.lookAt(0,0,0);
const guide=createTrajectoryGuide();scene.add(guide.object);guide.setPoints(new Float32Array([-2,-.7,0,-1,.4,0,0,.9,0,1,.4,0,2,-.7,0]),5,{point:[2,-.7,0],normal:[0,0,1]});
const wall=new T.Mesh(new T.BoxGeometry(8,5,.2),new T.MeshBasicMaterial({color:'#63636a'}));wall.position.z=2;scene.add(wall);const target=new T.WebGLRenderTarget(900,500),buffer=()=>{renderer.setRenderTarget(target);renderer.render(scene,camera);const a=new Uint8Array(900*500*4);renderer.readRenderTargetPixels(target,0,0,900,500,a);return a;};
const occluded=buffer();guide.object.visible=false;const control=buffer();wall.visible=false;guide.object.visible=true;const revealed=buffer();let occlusionDiff=0,visibleDiff=0;for(let i=0;i<occluded.length;i+=4){if(occluded[i]!==control[i]||occluded[i+1]!==control[i+1]||occluded[i+2]!==control[i+2])occlusionDiff++;}
guide.object.visible=false;const blank=buffer();for(let i=0;i<blank.length;i+=4){if(revealed[i]!==blank[i]||revealed[i+1]!==blank[i+1]||revealed[i+2]!==blank[i+2])visibleDiff++;}guide.object.visible=true;renderer.setRenderTarget(null);renderer.render(scene,camera);window.review={ready:true,occlusionDiff,visibleDiff,materials:guide.object.children.map(m=>({depthTest:m.material.depthTest,depthWrite:m.material.depthWrite}))};
</script>

<!doctype html><html lang="en"><meta charset="utf-8"><title>Skeleton motion studio</title>
<style>body{margin:0;background:#a9c0cc}canvas{display:block}#cap{position:fixed;left:12px;bottom:10px;font:600 18px system-ui;color:#fff;text-shadow:0 1px 3px #000}</style>
<div id="cap"></div>
<script type="module">
// Skeleton animation review: the shipped enemy-motion + skeleton-motion layers on the real skeleton.glb, scripted timeline
// (idle, walk, a Hero steps close so the shield comes up, claw swipe, hits, turn in place, lost arm, limp, crawl).
// Fixed-step and deterministic: window.studio.frame(i) renders frame i at 30 fps. ?variant=N ?dusk ?play ?cam=side|front|follow
// ?seg=walk|guard|attack (loops one beat). ?forgeling plays Dawnhold's forgeling (forgeling.glb on the same rig). Not shipped.
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {prepareAsset} from '../client/asset-pose.js';
import {applyEnemyMotion, noteEnemyHit} from '../client/enemy-motion.js';
import {maskMissingParts} from '../client/combat-view.js';
import {dressSkeleton} from '../client/skeleton-look.js';
import {dressForgelingModel,prepareForgelingTemplate} from '../client/forgeling-look.js';
const q=new URLSearchParams(location.search),W=innerWidth,H=innerHeight,dusk=q.has('dusk');
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(W,H);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.shadowMap.enabled=true;document.body.append(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(dusk?0x27324a:0xa9c0cc);s.fog=new THREE.Fog(s.background,18,40);
s.add(new THREE.HemisphereLight(dusk?0x5a6a90:0xc6e0ed,0x5e5139,dusk?.45:1.2));
const sun=new THREE.DirectionalLight(dusk?0x9fb0ff:0xffe3ad,dusk?.5:2.2);sun.position.set(6,10,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6});s.add(sun,sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:dusk?0x2c3a22:0x6f7d3d,roughness:1}));ground.receiveShadow=true;s.add(ground);
const hero=new THREE.Mesh(new THREE.CapsuleGeometry(.25,1.2,4,10),new THREE.MeshStandardMaterial({color:0x8a6a4a}));hero.position.y=.85;hero.visible=false;s.add(hero);
const cam=new THREE.PerspectiveCamera(40,W/H,.05,80);
const cap=document.getElementById('cap'),DT=1/30,ENTRY={enemy:true,root:new THREE.Group(),visual:null,data:{id:'studio',kind:'skeleton',hp:100,attackTick:-1000,missingParts:[]}};
s.add(ENTRY.root);
const SEG=[[0,'Idle'],[2.5,'Walk'],[6,'A Hero steps close: shield up'],[7.6,'Claw swipe'],[9.4,'Hit'],[11,'Turns in place'],[13.2,'Arm lost'],[14.6,'Leg lost: limping'],[17.4,'Both legs lost: crawling']];
const only=q.get('seg'),loops={walk:[2.6,5.9],guard:[6,7.5],attack:[7.4,9.3],turn:[11,13.1]};
function state(t){
 const d=ENTRY.data;let x=-2.6,yaw=-Math.PI/2;
 x+=Math.min(Math.max(t-2.5,0),3.3)*2.0; // walks along +X at sim speed 2 m/s
 if(t>14.6)x+=Math.min(t-14.6,2.6)*2*.55; if(t>17.4)x+=Math.min(t-17.4,2.6)*2*.2;
 if(t>=11&&t<13.2)yaw+=smoothstep((t-11.3)/1.6)*1.6;
 ENTRY.root.position.set(x,0,0);ENTRY.root.rotation.y=yaw;
 hero.visible=t>=6&&t<11;hero.position.set(4.1+1.25,.85,0);
 d.attackTick=t>=7.6?Math.round(7.6*60):-1000;
 const hits=[9.4].filter(h=>t>=h);d.hurtTick=hits.length?Math.round(hits.at(-1)*60):undefined;
 d.missingParts=[...(t>=13.2?['rightArm']:[]),...(t>=14.6?['leftLeg']:[]),...(t>=17.4?['rightLeg']:[])];}
const smoothstep=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x);};
let lastHurt,camMode=q.get('cam')||'follow';
window.studio={ready:false,frames:Math.round(20*30),frame(i){
 let t=i*DT;if(only&&loops[only]){const[a,b]=loops[only];t=a+(t%(b-a));}
 state(t);const d=ENTRY.data;
 if(d.hurtTick!==lastHurt&&d.hurtTick!==undefined){noteEnemyHit(ENTRY,{part:'torso',normal:[-1,0,.2]});lastHurt=d.hurtTick;}
 maskMissingParts(ENTRY.visual,d.missingParts);
 applyEnemyMotion(ENTRY,{tick:t*60,dt:DT,height:()=>0,threats:hero.visible?[hero.position.toArray()]:[]});
 const gx=ENTRY.root.position.x;
 if(camMode==='side')cam.position.set(gx,1.2,4.2),cam.lookAt(gx,.9,0);else if(camMode==='front')cam.position.set(gx+3.6,1.3,.6),cam.lookAt(gx,.95,0);else if(camMode==='threeq')cam.position.set(gx+2.2,1.5,-2.6),cam.lookAt(gx,1,0);else cam.position.set(gx+2.4,1.6,3.6),cam.lookAt(gx+.2,.9,0);
 sun.position.set(gx+6,10,4);sun.target.position.set(gx,0,0);
 cap.textContent=SEG.filter(([a])=>t>=a).at(-1)[1];r.render(s,cam);return t;}};
const forgeling=q.has('forgeling');
new GLTFLoader().load(forgeling?'/assets/forgeling.glb':'/assets/skeleton.glb',gltf=>{
 gltf.scene.traverse(n=>{if(n.isMesh)n.castShadow=true;});
 if(forgeling){prepareForgelingTemplate(gltf.scene);ENTRY.visual=prepareAsset(gltf,'forgeling',1.81).visual;dressForgelingModel(ENTRY.visual,q.get('variant')||'studio');}
 else{ENTRY.visual=prepareAsset(gltf,'skeleton',1.7).visual;dressSkeleton(ENTRY.visual,'studio',+(q.get('variant')||0));}ENTRY.root.add(ENTRY.visual);
 for(let i=0;i<3;i++)window.studio.frame(0);window.studio.ready=true;document.title='ready';
 if(q.has('play')){let i=0;setInterval(()=>{window.studio.frame(i);i=(i+1)%window.studio.frames;},1000/30);}});
</script></html>

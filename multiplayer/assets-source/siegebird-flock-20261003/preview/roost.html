<!doctype html><meta charset="utf-8"><title>Siegebird roost</title>
<style>html,body{margin:0;background:#20242a;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// Lingering reload birds: a hero fires a few times among real tree models; the flock hands each bird to the world
// roost, which perches it on a nearby tree or sends it to the distant ridges. ?shots=3 ?times=2,4,8 ?view=wide|perch
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {prepareAsset, updateWeaponPresentation} from '/client/asset-pose.js';
import {createSiegebirdFlock} from '/client/siegebird-flock.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb8d0);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .7;
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4); sun.position.set(20, 40, 10); scene.add(sun, new THREE.HemisphereLight(0xbfd6ff, 0x5a4a32, .6));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({color: 0x7c9a5a, roughness: 1})); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const load = n => new GLTFLoader().loadAsync(`/assets/${n}.glb`);
const [crossbow, bird, tree] = await Promise.all([load('crossbow'), load('siegebird_songbird'), load('tree')]);
const trees = [[6, -9, 6], [-8, -12, 6.5], [12, 4, 5.5], [-14, 2, 6], [3, 15, 6.2], [-5, -22, 6]].map(([x, z, h], i) => {
  const m = tree.scene.clone(); const box = new THREE.Box3().setFromObject(m); const s = h / (box.max.y - box.min.y); m.scale.setScalar(s); m.position.set(x, 0, z); scene.add(m); m.updateMatrixWorld(true);
  return {id: `t${i}`, x, z, height: h, mesh: m};
});
const camera = new THREE.PerspectiveCamera(70, 1, .05, 500); camera.position.set(0, 1.6, 0); camera.lookAt(0, 1.4, -10); scene.add(camera);
const anchor = new THREE.Group(); anchor.position.set(.18, -.22, -.42); camera.add(anchor);
const {visual} = prepareAsset(crossbow, 'crossbow'); anchor.add(visual);
const flock = createSiegebirdFlock({birdTemplate: bird, crossbowTemplate: crossbow});
const ray = new THREE.Raycaster();
flock.attachWorld({scene, standing: () => true, perch(from, heading) {   // same rule as game.js siegebirdPerches
  const near = []; for (const t of trees) { const dx = t.x - from.x, dz = t.z - from.z, d = Math.hypot(dx, dz); if (d < 4 || d > 26) continue; near.push({t, d, score: d * (1.35 - .6 * (dx * heading.x + dz * heading.z) / d)}); }
  near.sort((a, b) => a.score - b.score); const out = [];
  for (const {t, d} of near.slice(0, 4)) {
    const ox = (from.x - t.x) / d, oz = (from.z - t.z) / d; let position = null;
    for (const k of [.72, .62, .82]) { ray.set(new THREE.Vector3(t.x + ox * 5, t.height * k, t.z + oz * 5), new THREE.Vector3(-ox, 0, -oz)); ray.far = 5;
      const h = ray.intersectObject(t.mesh, true)[0]; if (h && Math.hypot(h.point.x - t.x, h.point.z - t.z) > .45) { position = [h.point.x + ox * .05, h.point.y, h.point.z + oz * .05]; break; } }
    out.push({id: t.id, position: position || [t.x + ox, t.height * .62, t.z + oz], facing: [ox, oz]});
  }
  return out; }});
const shots = +(q.get('shots') || 4), times = (q.get('times') || '1.3,2.4,4,6,10,24').split(',').map(Number);
const trail = []; const trailGeo = new THREE.BufferGeometry(); const trailLine = new THREE.Points(trailGeo, new THREE.PointsMaterial({color: 0xff3060, size: 3, sizeAttenuation: false})); scene.add(trailLine);
const cols = 3, rows = Math.ceil(times.length / cols), W = innerWidth / cols, H = innerHeight / rows;
const view = new THREE.PerspectiveCamera(50, W / H, .05, 500);
renderer.setScissorTest(true);
let t = 0, frame = 0; const dt = 1 / 30, viewer = new THREE.Vector3(0, 1.6, 0);
for (let s = 0; s < shots; s++) flock; // shots fired at 0, 1.2, 2.4 ...
for (const [i, until] of times.entries()) {
  while (t < until) {
    for (let s = 0; s < shots; s++) if (t <= s * 1.25 && t + dt > s * 1.25) { camera.rotation.y = s * .5; camera.updateMatrixWorld(true); flock.shot(visual, {n: s + 1, playerId: q.get('player') || 'roost', time: t}); flock.inform(visual, {n: s + 1, golden: s === 2}); }
    const last = Math.max(...[0, 1, 2, 3].map(s => s * 1.25).filter(x => x <= t)); updateWeaponPresentation(visual, 'crossbow', {reload: t - last});
    camera.updateMatrixWorld(true); flock.update(visual, t, {}); flock.updateWorld(t, {viewer}); t += dt; frame++;
    if (frame % 3 === 0) for (const w of flock.roost) trail.push(w.bird.root.position.x, w.bird.root.position.y, w.bird.root.position.z);
  }
  trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(trail, 3));
  const focus = flock.roost[0]?.bird.root.position;
  const w0 = flock.roost[0];
  if (q.get('view') === 'perch' && focus) { const f = w0.facing || new THREE.Vector3(1, 0, 1).normalize(); view.position.copy(focus).addScaledVector(f, +(q.get('dist') || 1.6)).add(new THREE.Vector3(0, .25, 0)); view.lookAt(focus); }
  else { view.position.set(0, 14, 24); view.lookAt(0, 3, -4); }
  const vx = (i % cols) * W, vy = (rows - 1 - Math.floor(i / cols)) * H;
  renderer.setViewport(vx, vy, W, H); renderer.setScissor(vx, vy, W, H); renderer.render(scene, view);
}
window.roostStats = {...flock.stats, live: flock.roost.map(w => w.state)};
console.log('roost', JSON.stringify(window.roostStats));
window.previewReady = true;
</script>

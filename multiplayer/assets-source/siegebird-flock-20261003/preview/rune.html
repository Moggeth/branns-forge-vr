<!doctype html><meta charset="utf-8"><title>Siegebird golden rune</title>
<style>html,body{margin:0;background:#1d2228;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// Golden bolt rune flash for tools/clip.mjs / shoot.mjs: window.frame(t) renders t seconds after a golden shot.
// ?view=three|front|fps|side ?t=.1 (still frame) ?dusk=1 (darker sky)
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {prepareAsset, updateWeaponPresentation} from '/client/asset-pose.js';
import {createSiegebirdSight, SIEGEBIRD_PRESENTATION} from '/client/siegebird-sight.js';
import {createSiegebirdFlock, goldenBoltMaterial} from '/client/siegebird-flock.js';
const q = new URLSearchParams(location.search), view = q.get('view') || 'three', dusk = q.get('dusk') === '1';
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const sky = dusk ? 0x2b3346 : 0x7d98b3;
const scene = new THREE.Scene(); scene.background = new THREE.Color(sky); scene.fog = new THREE.Fog(sky, 8, 40);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = dusk ? .3 : .6;
const sun = new THREE.DirectionalLight(0xfff1dc, dusk ? 1.0 : 2.4); sun.position.set(3, 6, 2); scene.add(sun, new THREE.HemisphereLight(0xcfe2ff, 0x5a4a36, dusk ? .35 : .7));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({color: 0x5f7a45, roughness: .95})); ground.rotation.x = -Math.PI / 2; ground.position.y = -1.5; scene.add(ground);
const loader = new GLTFLoader();
const [crossbow, bird] = await Promise.all([loader.loadAsync('/assets/crossbow.glb'), loader.loadAsync('/assets/siegebird_songbird.glb')]);
const flock = createSiegebirdFlock({birdTemplate: bird, crossbowTemplate: crossbow});
const anchor = new THREE.Group(); scene.add(anchor);
const {visual} = prepareAsset(crossbow, 'crossbow'); anchor.add(visual);
createSiegebirdSight(THREE, visual);
visual.updateMatrixWorld(true);
const native = visual.getObjectByName('Pinion').parent, W = (x, y, z) => native.localToWorld(new THREE.Vector3(x, y, z));
const cam = new THREE.PerspectiveCamera(view === 'fps' ? 60 : 32, innerWidth / innerHeight, .01, 100);
const up = () => W(0, 0, 1).sub(W(0, 0, 0)).normalize();
if (view === 'fps') { anchor.position.fromArray(SIEGEBIRD_PRESENTATION.hip); visual.updateMatrixWorld(true); cam.position.set(0, 0, 0); cam.lookAt(0, 0, -10); }
else {
  const eye = {three: [.75, 1.85, .42], front: [.12, 2.05, .26], side: [1.25, 1.0, .25]}[view] || [.75, 1.85, .42];
  cam.position.copy(W(...eye)); cam.up.copy(up()); cam.lookAt(W(0, view === 'side' ? .95 : 1.135, .17));
}
// A golden bolt in flight: the crossbow's own Bolt, gilded, launched from the seat along native +Y.
const seatBolt = visual.getObjectByName('Bolt'), flying = seatBolt.clone(true);
flying.traverse(n => { if (n.isMesh) n.material = goldenBoltMaterial(n.material); });
seatBolt.parent.add(flying); const seat = seatBolt.position.clone(); seatBolt.visible = false;
const shotAt = 100; flock.rest(visual, true); flock.fired(visual, true);
let prev = -1 / 60;
window.frame = real => {
  for (let s = prev + 1 / 60; s < real; s += 1 / 60) flock.update(visual, shotAt + s, {});
  flock.update(visual, shotAt + real, {}); prev = real;
  updateWeaponPresentation(visual, 'crossbow', {reload: 0, time: shotAt + real});
  flying.position.copy(seat); flying.position.y += 9 * real * real + 2.5 * real; flying.visible = real < .5;
  renderer.render(scene, cam);
};
window.frame(+(q.get('t') || 0));
window.previewReady = true;
</script>

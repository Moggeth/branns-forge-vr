<!doctype html><meta charset="utf-8"><title>Siegebird showpiece review</title>
<style>html,body{margin:0;background:#141820;overflow:hidden}canvas{display:block}#tag{position:fixed;left:10px;top:8px;font:600 13px system-ui;color:#fff;background:#0008;padding:3px 8px;border-radius:4px}</style>
<div id="tag"></div>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// Review page for the Siegebird showpiece pass. Serve with ../../siegebird-flock-20261003/preview/serve.mjs.
// ?view=fps|stones|plate|hero|side|top|inspect  &glb=  &t= (seconds since the shot; reload timeline)  &mood=day|dusk|night
// &fx=0 disables the runtime showpiece layer (before/after), &golden=1, &fire=<seconds after a shot to show the flash>
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {prepareAsset, updateWeaponPresentation, setWeaponGrip, FPS_WEAPON_POSE} from '/client/asset-pose.js';
import {createSiegebirdSight, SIEGEBIRD_PRESENTATION} from '/client/siegebird-sight.js';
import {createSiegebirdAim} from '/client/siegebird-aim.js';
import {createSiegebirdShowpiece} from '/client/siegebird-showpiece.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || innerWidth), H = +(q.get('h') || innerHeight);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const mood = q.get('mood') || 'day';
const MOODS = {
  day: {bg: 0x8fb3cf, env: .7, sun: [0xfff1dc, 2.6], hemi: [0xbfd6ff, 0x3a2e22, .6], exposure: 1},
  dusk: {bg: 0x3a2f45, env: .35, sun: [0xff9a5a, 1.3], hemi: [0x6a6aa0, 0x2a1a18, .35], exposure: 1.05},
  night: {bg: 0x0b1020, env: .12, sun: [0x8fa8ff, .35], hemi: [0x26345a, 0x0a0806, .25], exposure: 1.1},
}[mood];
renderer.toneMappingExposure = MOODS.exposure;
const scene = new THREE.Scene(); scene.background = new THREE.Color(MOODS.bg); scene.fog = new THREE.Fog(MOODS.bg, 8, 40);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = MOODS.env;
const sun = new THREE.DirectionalLight(...MOODS.sun); sun.position.set(-3, 5, 2); scene.add(sun, new THREE.HemisphereLight(...MOODS.hemi));
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({color: mood === 'day' ? 0x5d7a3a : 0x2a3326, roughness: .95, depthWrite: false}));
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.6; ground.renderOrder = -10; if (q.get('ground') !== '0') scene.add(ground);
const camera = new THREE.PerspectiveCamera(70, W / H, .01, 80); scene.add(camera);
const gltf = await new GLTFLoader().loadAsync(q.get('glb') || '/assets/crossbow.glb');
const {visual} = prepareAsset(gltf, 'crossbow');
const view = q.get('view') || 'fps';
const anchor = new THREE.Group(); anchor.add(visual);
const t = +(q.get('t') ?? 1.5), golden = q.get('golden') === '1';
setWeaponGrip(visual, false, 'crossbow');
if (view === 'fps') { camera.add(anchor); anchor.position.fromArray(q.get('ads') ? [0, -.394, -.42] : SIEGEBIRD_PRESENTATION.hip); if (!q.get('ads')) anchor.position.x *= Math.min(1, camera.aspect / .9); }
else scene.add(anchor);
const sight = createSiegebirdSight(THREE, visual);
const aim = null;
const ads = +(q.get('ads') || 0);
const fx = q.get('fx') !== '0' ? createSiegebirdShowpiece({scene, camera, quality: q.get('quality') || 'high', localId: () => 'me', ownerFletch: () => +(q.get('plumage') || 0)}) : null;
fx?.dress(visual);
updateWeaponPresentation(visual, 'crossbow', {recoil: 0, time: 0, reload: t});
scene.updateMatrixWorld(true);
// Native-space camera targets (X right, Y forward, Z up), mapped through the crossbow's world matrix.
const native = (x, y, z) => { const n = visual.getObjectByName('Body'); return n ? n.localToWorld(new THREE.Vector3(x, y, z)) : new THREE.Vector3(); };
const bodyNode = visual.getObjectByName('Body');
const toWorld = (x, y, z) => bodyNode.parent.localToWorld(new THREE.Vector3(x, y, z));
const VIEWS = {
  stones: {eye: [.16, .70, .30], at: [.0, .87, .14], fov: 32},
  plate: {eye: [-.28, .22, .10], at: [-.02, .22, .07], fov: 24},
  hero: {eye: [.75, 1.45, .45], at: [0, .62, .05], fov: 34},
  side: {eye: [1.25, .55, .12], at: [0, .55, .04], fov: 40},
  rear: {eye: [-.42, -.18, .42], at: [0, .55, .10], fov: 42},
  winch: {eye: [.46, .50, .05], at: [.15, .70, -.02], fov: 34},
  wing: {eye: [.45, .70, .55], at: [.25, .95, .08], fov: 36},
  head: {eye: [.25, 1.25, .30], at: [0, 1.02, .16], fov: 30},
};
const impactAt = new THREE.Vector3(0, .2, -3.2);
if (view === 'impact' || view === 'flight') {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(3, 2.2, .4), new THREE.MeshStandardMaterial({color: 0x7d7468, roughness: .9}));
  wall.position.set(0, .2, -3.4); scene.add(wall); anchor.visible = false;
  camera.position.set(view === 'impact' ? .9 : 0, .45, view === 'impact' ? -1.6 : -.2); camera.lookAt(view === 'impact' ? impactAt : new THREE.Vector3(0, .25, -2.4));
} else if (view !== 'fps') {
  const v = VIEWS[view]; camera.fov = v.fov; camera.updateProjectionMatrix();
  camera.position.copy(toWorld(...v.eye)); camera.up.set(0, 1, 0); camera.lookAt(toWorld(...v.at));
}
document.getElementById('tag').textContent = q.get('label') || `${view} · ${mood}${fx ? '' : ' · before'}`;
// Settle: run the runtime layer for a while on a fixed clock so glints, wisps and lights are in a representative state.
const fire = q.get('fire');
const steps = +(q.get('steps') || 90);
let clock = 0;
for (let i = 0; i < steps; i++) {
  const dt = 1 / 60; clock += dt;
  const fireAt = fire !== null ? steps / 60 - +fire : -1;
  if (fx && fire !== null && Math.abs(clock - fireAt) < dt / 2 + 1e-6) fx.fired(visual, {golden});
  const impactT = q.get('impact'); if (fx && impactT !== null && Math.abs(clock - (steps / 60 - +impactT)) < dt / 2 + 1e-6) fx.impact(impactAt.toArray(), [0, 0, 1], {plumage: +(q.get('plumage') || 0), golden, material: 'stone'});
  if (fx && view === 'flight') { const u = Math.min(1, clock / (steps / 60)); const b = new THREE.Vector3(-1.4 + 2.2 * u, .25 + .05 * u, -2.6); fx.trails([{id: 'b1', kind: 'bolt', ownerId: 'me', golden}], () => b, dt); }
  const rt = fire !== null && clock >= fireAt ? clock - fireAt : t;
  updateWeaponPresentation(visual, 'crossbow', {recoil: 0, time: clock, reload: rt});
  fx?.update(dt, clock, {visual, reload: rt, golden, night: mood === 'night' ? 1 : mood === 'dusk' ? .5 : 0, aiming: false});
  aim?.update(dt, ads);
  scene.updateMatrixWorld(true);
}
renderer.render(scene, camera);
window.__dbg = {scene, camera, visual, anchor, fx}; window.previewReady = true;
</script>

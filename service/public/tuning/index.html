<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brann · Tuning bench</title><style>body{font:16px system-ui;background:#17201d;color:#ece9da;margin:0}main{max-width:900px;margin:40px auto;padding:24px}h1{color:#edbc72}fieldset{border:1px solid #50675a;border-radius:10px;margin:20px 0;padding:18px}legend{text-transform:capitalize;color:#edbc72}label{display:grid;grid-template-columns:1fr 2fr 5em;gap:15px;align-items:center;margin-top:16px}small{display:block;color:#b1c3b7;margin:4px 0 16px}button,select{font:inherit;background:#354c3c;color:white;border:1px solid #72947e;padding:10px;margin:4px;cursor:pointer}input{width:100%}nav{position:sticky;top:0;background:#17201d;padding:12px 0}#status{min-height:1.5em}@media(max-width:600px){label{grid-template-columns:1fr}nav{position:static}}</style><main><h1>Tuning bench</h1><p>Adjust a batch, then apply it to the running game. Controls update their value labels as you drag. Changes persist locally; Undo restores the previous applied snapshot.</p><nav><button id="apply">Apply changes</button><button id="reload">Reload current</button><button id="undo">Undo last apply</button><button id="reset">Reset defaults</button><select id="preset" aria-label="Preset"></select><button id="loadPreset">Apply preset</button><p id="status" role="status">Loading…</p></nav><form id="controls"></form><script src="bench.js"></script></main></html>
